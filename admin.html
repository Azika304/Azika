<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Azika Admin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0b0b1a;--card:#15152b;--card2:#1c1c38;--line:#2a2a4d;--tx:#f1f1ff;--mu:#8e8eb8;--ac:#6366f1;--ac2:#818cf8;--ok:#22c55e;--no:#ef4444;--wa:#f59e0b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,Segoe UI,Roboto,sans-serif}
body{padding:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)) 16px calc(96px + env(safe-area-inset-bottom));min-height:100vh;background:radial-gradient(600px 300px at 80% -50px,#312e8155,transparent),var(--bg)}
h1{font-size:22px;margin:18px 0 12px;display:flex;align-items:center;gap:10px}
h1 b{color:var(--ac2)}
.onl{margin-left:auto;font-size:13px;font-weight:800;padding:6px 11px;border-radius:99px;background:#22c55e22;border:1px solid #22c55e55;color:#86efac;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.mu{color:var(--mu);font-size:13px}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mav{position:relative;width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,#4f46e5,#818cf8);display:grid;place-items:center;font-weight:700;overflow:hidden;flex:none}
.mav img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.btns{display:flex;gap:8px;margin-top:12px}
button{font:inherit;border:0;border-radius:13px;padding:11px 14px;color:var(--tx);background:var(--card2);cursor:pointer}
button.ok{background:var(--ok);color:#04210f;font-weight:600}
button.no{background:#3b1620;color:#ff8a8a}
button.pr{background:var(--ac);font-weight:600}
button.f{flex:1}
button:active{transform:scale(.97)}
button:disabled{opacity:.5}
input,textarea,select{width:100%;font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:11px 13px;outline:0}
input:focus,textarea:focus{border-color:var(--ac)}
.seg{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;scrollbar-width:none}
.seg button{white-space:nowrap;padding:8px 13px;border-radius:20px;font-size:14px}
.seg button.on{background:var(--ac);font-weight:600}
.sec{font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin:18px 2px 8px}
.badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:var(--no);font-size:11px;line-height:18px;text-align:center;margin-left:4px}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;background:var(--card2);color:var(--mu)}
.pill.g{background:#10301c;color:#6ee7a0}.pill.r{background:#3b1620;color:#ff8a8a}.pill.y{background:#3a2c0b;color:#fbbf24}
.empty{text-align:center;color:var(--mu);padding:36px 0}
.tabs{position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;background:#15152bf0;backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:26px;padding:6px;z-index:5}
.tabs button{flex:1;background:none;padding:9px 0;font-size:11px;color:var(--mu);border-radius:20px;position:relative;z-index:1}
.tabs button span{display:block;font-size:20px}
.tabs button.on{color:#fff}
.pillbg{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);background:var(--ac);border-radius:20px;transition:transform .3s cubic-bezier(.3,1.2,.5,1)}
.sheet-bg{position:fixed;inset:0;background:#0009;z-index:10;opacity:0;transition:.2s;pointer-events:none}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--card);border-radius:26px 26px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto;transform:translateY(105%);transition:transform .3s cubic-bezier(.3,1,.4,1)}
.sheet.on{transform:none}
.toast{opacity:0;position:fixed;left:50%;top:14px;transform:translate(-50%,-150%);background:#25254a;border:1px solid var(--line);padding:10px 16px;border-radius:14px;z-index:30;transition:.3s;max-width:90%}
.toast.on{opacity:1;transform:translate(-50%,0)}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi div{background:var(--card2);border-radius:14px;padding:11px}
.kpi b{font-size:20px;display:block}
.sw{position:relative;width:54px;height:32px;border-radius:16px;background:#16a34a;flex:none;transition:background .3s;cursor:pointer;box-shadow:inset 0 0 0 1px #ffffff1f}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .35s cubic-bezier(.3,1.5,.5,1);box-shadow:0 2px 6px #0006}
.sw.on{background:var(--no)}.sw.on::after{transform:translateX(22px)}
.sw:active::after{width:32px}.sw.on:active::after{transform:translateX(16px)}
.swl{font-size:12px;font-weight:600;color:#6ee7a0;transition:color .3s}.swl.on{color:#ff8a8a}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slideL{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
#v.l{animation:slideL .32s cubic-bezier(.2,.8,.3,1)}#v.r{animation:slideR .32s cubic-bezier(.2,.8,.3,1)}
#v .card,#v .seg,#v>button,#v>input,.sec{animation:rise .45s cubic-bezier(.2,.8,.3,1) both}
#v>*:nth-child(2){animation-delay:.04s}#v>*:nth-child(3){animation-delay:.08s}#v>*:nth-child(4){animation-delay:.12s}#v>*:nth-child(5){animation-delay:.16s}#v>*:nth-child(6){animation-delay:.2s}#v>*:nth-child(n+7){animation-delay:.24s}
h1 .mav{animation:pop .6s cubic-bezier(.3,1.4,.5,1) both}
button{transition:transform .12s,background .2s,opacity .2s}
.badge{animation:pop .4s both}
.card{transition:transform .15s,border-color .2s}.card[data-s]:active,.card[data-c]:active{transform:scale(.98);border-color:var(--ac)}
.sheet.on > *{animation:rise .4s both}.sheet.on > *:nth-child(2){animation-delay:.05s}.sheet.on > *:nth-child(3){animation-delay:.1s}.sheet.on > *:nth-child(n+4){animation-delay:.15s}
.bub{max-width:82%;padding:9px 12px;border-radius:16px;margin:6px 0;animation:pop .3s both;word-wrap:break-word;white-space:pre-wrap}
.bub.me{margin-left:auto;background:var(--ac);border-bottom-right-radius:5px}.bub.he{background:var(--card2);border-bottom-left-radius:5px}
.bub small{display:block;font-size:10px;opacity:.6;margin-top:3px}
#msgs{height:42vh;overflow-y:auto;padding:4px 2px;display:flex;flex-direction:column}
.rv{background:#3a2c0b;border:1px solid #6b4e12;color:#fbbf24;border-radius:14px;padding:10px 12px;margin-top:12px;font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.lbl{font-size:13px;color:var(--mu);margin:12px 0 6px}
.ico{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#312e81,#4f46e5);display:grid;place-items:center;font-size:22px;flex:none}
.ctl{position:relative;padding-left:18px;overflow:hidden}
.ctl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:#16a34a;transition:background .3s}
.ctl.off::before{background:var(--no)}
.tg{position:relative;display:grid;grid-template-columns:1fr 1fr;height:46px;background:var(--card2);border-radius:15px;padding:4px;margin-top:14px;cursor:pointer;user-select:none}
.tg::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:12px;background:#16a34a;transition:transform .38s cubic-bezier(.3,1.35,.5,1),background .3s;box-shadow:0 4px 14px #0005}
.tg.on::before{transform:translateX(100%);background:var(--no)}
.tg span{position:relative;z-index:1;display:grid;place-items:center;font-weight:600;font-size:14px;color:var(--mu);transition:color .25s}
.tg span.a{color:#fff}
.tg:active::before{filter:brightness(1.15)}
.ib{width:42px;height:42px;padding:0;border-radius:13px;flex:none;font-size:17px}
.onl{color:#2ee6a6;font-weight:700}.onl::first-letter{animation:onl 1.6s infinite}@keyframes onl{50%{opacity:.35}}
.bch{display:flex;align-items:flex-end;gap:3px;height:110px;margin:6px 0 4px}.bch i{flex:1;min-width:2px;border-radius:5px 5px 2px 2px;background:var(--ac);opacity:.9;position:relative;min-height:2px}.bch i.z{opacity:.25}
.bchl{display:flex;justify-content:space-between;font-size:11px;color:var(--mu);font-weight:700;margin-bottom:10px}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.kp>div{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:12px}.kp b{display:block;font-size:20px;font-weight:800}.kp span{font-size:11.5px;color:var(--mu);font-weight:700}
.hb{margin:8px 0}.hb .t{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:4px;gap:8px}.hb .t span:last-child{color:var(--mu);white-space:nowrap}.hb .b{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.hb .b i{display:block;height:100%;border-radius:99px;background:var(--ac)}
.sth{font-size:12px;font-weight:800;color:var(--mu);margin:16px 0 4px;letter-spacing:.3px}
</style>
</head>
<body>
<h1><span class="mav" style="width:36px;height:36px;border-radius:12px">🛠</span> Azika <b>Admin</b><span id="onl" class="onl" title="Сейчас в приложениях">🟢 …</span></h1>
<div id="v"></div>
<nav class="tabs"><div class="pillbg" id="pb"></div>
<button data-t="q"><span>📥</span>Заявки</button><button data-t="s"><span>👥</span>Продавцы</button><button data-t="c"><span>💬</span>Чаты</button><button data-t="p"><span>🎟</span>Промо</button><button data-t="m"><span>⚙️</span>Ещё</button></nav>
<div class="sheet-bg" id="sbg"></div><div class="sheet" id="sh"></div><div class="toast" id="ts"></div>
<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.requestFullscreen && !tg.isFullscreen && /^(android|android_x|ios)$/.test(tg.platform || "") && tg.requestFullscreen(); } catch (e) {} try { tg.setHeaderColor("#0b0b1a"); tg.setBackgroundColor("#0b0b1a"); } catch (e) {} }
const params = new URLSearchParams(location.search);
const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} };
const API = (params.get("api") || store("api") || "https://92-243-74-80.sslip.io:8443/shop").replace(/\/$/, "");
if (params.get("api")) store("api", API);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const seenHtml = (ts, on) => { if (on) return '<span class="onl">● онлайн</span>'; if (!ts) return ""; const m = Math.max(1, (Date.now() / 1000 - ts) / 60 | 0); return "был(а) " + (m < 60 ? m + " мин" : m < 1440 ? (m / 60 | 0) + " ч" : (m / 1440 | 0) + " дн") + " назад"; };
const ltr = n => esc(String(n || "?").replace(/^@/, "").slice(0, 1).toUpperCase());
async function api(name, body = {}) {
  const r = await fetch(API + "/api/admin/" + name, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...body, initData: tg ? tg.initData : "" }) });
  const j = await r.json().catch(() => ({ ok: false, msg: "Ошибка ответа сервера" }));
  if (!j.ok && j.msg && !body.quiet) toast(j.msg);
  return j;
}
let tt;
function toast(m) { const t = $("#ts"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2600); }
function haptic(k = "light") { try { tg.HapticFeedback.impactOccurred(k); } catch (e) {} }
function sheet(html) { $("#sh").innerHTML = html; $("#sbg").classList.add("on"); $("#sh").classList.add("on"); }
let closeSheet = function closeSheet0() { $("#sbg").classList.remove("on"); $("#sh").classList.remove("on"); };
const av = (src, name) => `<span class="mav">${ltr(name)}${src ? `<img src="${esc(/^https?:/.test(src) ? src : API + src)}" alt="" onerror="this.remove()">` : ""}</span>`;
const ago = ts => { if (!ts) return ""; const m = Math.max(0, (Date.now() / 1000 - ts) / 60 | 0); return m < 60 ? m + " мин назад" : m < 1440 ? (m / 60 | 0) + " ч назад" : (m / 1440 | 0) + " дн назад"; };
const V = html => { $("#v").innerHTML = html; };

let tab = "q", counts = {}, sq = "", smode = "a";
const TABS = ["q", "s", "c", "p", "m"];
function setTab(t) {
  const dir = TABS.indexOf(t) >= TABS.indexOf(tab) ? "l" : "r"; tab = t;
  const v = $("#v"); v.className = ""; void v.offsetWidth; v.className = dir; $("#pb").style.transform = `translateX(${TABS.indexOf(t) * 100}%)`;
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  haptic(); ({ q: viewQueue, s: viewSellers, c: viewChatsTab, p: viewPromos, m: viewMore })[t]();
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => setTab(b.dataset.t));
function badge() {
  [["q", counts.total], ["c", counts.chat]].forEach(([t, n]) => {
    const b = document.querySelector(`.tabs button[data-t="${t}"]`), o = b.querySelector(".badge"); o && o.remove();
    if (n) b.insertAdjacentHTML("beforeend", `<i class="badge">${n}</i>`);
  });
}

const tg2 = (on, a, b) => `<div class="tg ${on ? "on" : ""}"><span class="${on ? "" : "a"}">${a}</span><span class="${on ? "a" : ""}">${b}</span></div>`;
function flip(el, card) { const on = !el.classList.contains("on"); el.classList.toggle("on", on); [...el.children].forEach((x, i) => x.classList.toggle("a", on ? i === 1 : i === 0)); if (card) card.classList.toggle("off", on); haptic("medium"); return on; }

/* ---------- Заявки ---------- */
async function viewQueue() {
  V(`<div class="empty">Загрузка…</div>`);
  const q = await api("queue"); if (tab !== "q") return;
  if (!q.ok) return V(`<div class="empty">${esc(q.msg || "Нет связи")}</div>`);
  counts.total = q.sellers.length + q.verify.length + q.offers.length + q.payouts.length; badge();
  const act = (k, id) => `<div class="btns"><button class="no f" data-d="${k}:${id}:0">Отклонить</button><button class="ok f" data-d="${k}:${id}:1">Одобрить</button></div>`;
  let h = "";
  if (q.sellers.length) h += `<div class="sec">Заявки на продажу · ${q.sellers.length}</div>` + q.sellers.map(x => `<div class="card"><div class="row">${av(x.av, x.name)}<div class="grow"><div class="t">${esc(x.name)}</div><div class="mu">${x.username ? "@" + esc(x.username) + " · " : ""}${ago(x.created)}</div></div></div>${x.about ? `<div style="margin-top:10px">${esc(x.about)}</div>` : ""}${act("seller", x.id)}</div>`).join("");
  if (q.verify.length) h += `<div class="sec">Заявки на галочку ✓ · ${q.verify.length}</div>` + q.verify.map(x => `<div class="card"><div class="row">${av(x.av, x.name)}<div class="grow"><div class="t">${esc(x.name)}</div><div class="mu">${esc(x.level)} · сделок ${x.deals} · отзывов ${x.reviews}${x.avg ? " · ★" + x.avg : ""}</div></div></div>${act("verify", x.id)}</div>`).join("");
  if (q.offers.length) h += `<div class="sec">Товары на проверке · ${q.offers.length}</div>` + q.offers.map(x => `<div class="card"><div class="row"><span class="mav">📦<img src="${esc(API + x.img)}" alt="" onerror="this.remove()"></span><div class="grow"><div class="t">${esc(x.title)}</div><div class="mu">${esc(x.game)} · ${x.stars}⭐ · ${esc(x.seller_name)}</div></div></div>${x.descr ? `<div class="mu" style="margin-top:8px">${esc(x.descr)}</div>` : ""}${act("offer", x.id)}</div>`).join("");
  if (q.payouts.length) h += `<div class="sec">Выплаты · ${q.payouts.length}</div>` + q.payouts.map(x => `<div class="card"><div class="row"><div class="grow"><div class="t">${x.stars}⭐ → ${esc(x.seller_name)}</div><div class="mu">Реквизиты: ${esc(x.details)} · ${ago(x.created)}</div></div></div>${act("payout", x.id)}</div>`).join("");
  V(h || `<div class="empty">🎉 Всё разобрано<br>Новых заявок нет</div>`);
  document.querySelectorAll("[data-d]").forEach(b => b.onclick = () => {
    const [k, id, ok] = b.dataset.d.split(":");
    if (ok === "1") return doDecide(k, +id, true, "");
    sheet(`<div class="t" style="font-size:17px">Причина отказа</div><div class="lbl">Покажем её пользователю (можно пропустить)</div><textarea id="rs" rows="3" maxlength="300"></textarea><div class="btns"><button class="f" onclick="closeSheet()">Отмена</button><button class="no f" id="rgo">Отклонить</button></div>`);
    $("#rgo").onclick = () => { const r = $("#rs").value; closeSheet(); doDecide(k, +id, false, r); };
  });
}
async function doDecide(kind, id, ok, reason) {
  haptic("medium"); const j = await api("decide", { kind, id, ok, reason }); if (j.ok) toast(j.msg); viewQueue();
}

/* ---------- Продавцы ---------- */
let sTimer;
function viewSellers() {
  V(`<input id="sq" placeholder="Поиск: имя, @username или ID" value="${esc(sq)}">
  <div class="seg" style="margin-top:10px">${[["a", "Все"], ["p", "Заявки"], ["v", "На галочку"]].map(([k, n]) => `<button data-m="${k}" class="${smode === k ? "on" : ""}">${n}</button>`).join("")}</div><div id="sl"></div>`);
  $("#sq").oninput = e => { sq = e.target.value; clearTimeout(sTimer); sTimer = setTimeout(loadSellers, 300); };
  document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { smode = b.dataset.m; viewSellers(); });
  loadSellers();
}
const stPill = s => s.status === "banned" ? `<span class="pill r">заблокирован</span>` : s.status === "pending" ? `<span class="pill y">заявка</span>` : s.review ? `<span class="pill y">🔍 проверка</span>` : "";
async function loadSellers() {
  const j = await api("sellers", { page: 0, mode: smode, q: sq }); const box = $("#sl"); if (!box || !j.ok) return;
  box.innerHTML = j.sellers.length ? j.sellers.map(s => `<div class="card" data-s="${s.id}" style="cursor:pointer"><div class="row">${av(s.av, s.name)}<div class="grow"><div class="t">${esc(s.name)}${s.verified ? " ✅" : ""}</div><div class="mu">${esc(s.name_lvl)} · сделок ${s.deals} · ${s.offers} товаров</div></div>${stPill(s)}${s.verify_req && !s.verified ? `<span class="pill y">✓?</span>` : ""}</div></div>`).join("") : `<div class="empty">Никого не найдено</div>`;
  box.querySelectorAll("[data-s]").forEach(c => c.onclick = () => openSeller(j.sellers.find(x => x.id == c.dataset.s)));
}
function openSeller(s) {
  const L = s.levels;
  sheet(`<div class="row">${av(s.av, s.name)}<div class="grow"><div class="t" style="font-size:17px">${esc(s.name)}${s.verified ? " ✅" : ""}</div><div class="mu">ID ${s.id}${s.username ? " · @" + esc(s.username) : ""}</div></div>${stPill(s)}</div>
  <div class="kpi" style="margin-top:14px"><div><span class="mu">Уровень</span><b>${esc(s.name_lvl)}</b><span class="mu">комиссия ${s.fee}% · лимит ${s.limit}${s.lvl_set ? " · ручной" : ""}</span></div>
  <div><span class="mu">Сделки / отзывы</span><b>${s.deals} / ${s.cnt}</b><span class="mu">${s.avg ? "★ " + s.avg : "без оценок"}</span></div>
  <div><span class="mu">Баланс</span><b>${s.balance}⭐</b><span class="mu">заработано ${s.earned}⭐</span></div>
  <div><span class="mu">Товаров</span><b>${s.offers}</b><span class="mu">в работе заказов ${s.live}</span></div></div>
  ${s.about ? `<div class="mu" style="margin-top:12px">${esc(s.about)}</div>` : ""}
  ${s.review ? `<div class="rv">🔍 Продавец на проверке · его товары скрыты из магазина</div><button class="ok" style="width:100%;margin-top:10px" id="revoff">✅ Завершить проверку</button>` : `<button style="width:100%;margin-top:14px" id="revon">🔍 Вызвать на проверку</button>`}

function statBars(arr, key, lbl) {

}
function statHb(items, nameK, valK, cntK, unit) {
  const mx = Math.max(1, ...items.map(x => x[valK]));
  return items.map(x => `<div class="hb"><div class="t"><span>${esc(String(x[nameK]))}</span><span>${x[valK]} ${unit}${cntK ? " · " + x[cntK] + " зак." : ""}</span></div><div class="b"><i style="width:${Math.max(3, Math.round(x[valK] / mx * 100))}%"></i></div></div>`).join("");
}

  <div class="btns" style="margin-top:0;margin-bottom:12px"><button class="no f" data-sa="1">⏸ Остановить всё</button><button class="ok f" data-sa="0">▶ Запустить всё</button></div>
  ${s ? `<div class="sec">Шоп</div><div class="card kpi"><div><span class="mu">Пользователи</span><b>${s.users}</b></div><div><span class="mu">Сегодня</span><b>${s.today}</b><span class="mu">${s.today_stars}⭐</span></div><div><span class="mu">Всего оплат</span><b>${s.paid}</b><span class="mu">${s.paid_stars}⭐</span></div><div><span class="mu">Ждут выдачи</span><b>${s.wait}</b></div><div><span class="mu">Споры</span><b>${s.disputes}</b></div><div><span class="mu">Продавцов</span><b>${s.sellers}</b><span class="mu">блок ${s.sellers_banned}</span></div></div>` : ""}
  ${v ? `<div class="sec">VPN</div><div class="card kpi"><div><span class="mu">Пользователи</span><b>${v.users}</b></div><div><span class="mu">Активных</span><b>${v.active}</b></div><div><span class="mu">Оплат</span><b>${v.payments}</b></div><div><span class="mu">Сегодня</span><b>${v.payments_today}</b></div></div>` : ""}`);
  $("#stbtn").onclick = () => { haptic(); statsSheet(); };
  $("#paybtn").onclick = () => { haptic(); paySheet(); };
  document.querySelectorAll("[data-sw]").forEach(d => d.onclick = async () => {
    const t = d.firstChild, on = flip(t, d.closest(".card")), r = await api("pause", { which: d.dataset.sw, on }); if (r.ok) { toast(on ? "Продажи остановлены" : "Продажи запущены"); setTimeout(viewMore, 380); } else viewMore();
  });
  document.querySelectorAll("[data-sa]").forEach(b => b.onclick = async () => { const r = await api("pause", { which: "all", on: b.dataset.sa === "1" }); if (r.ok) { haptic("medium"); toast("Сохранено"); viewMore(); } });
  $("#pmb").onclick = async () => { const r = await api("pause", { which: "all", text: $("#pm").value }); if (r.ok) toast("Текст сохранён"); };
}

const onl = j => { if (j && j.online && $("#onl")) $("#onl").textContent = "🟢 " + j.online.now + " онлайн · " + j.online.day + " за сутки"; };
setInterval(() => { if (!document.hidden) api("overview", { quiet: true }).then(j => { if (j.ok) { onl(j); counts.total = j.counts.total || 0; counts.chat = j.chat_unread || 0; badge(); } }); }, 25000);
setTab("q");
api("overview", { quiet: true }).then(j => { if (j.ok) { onl(j); counts.total = j.counts.total || 0; counts.chat = j.chat_unread || 0; badge(); } });
</script>
</body>
</html>
