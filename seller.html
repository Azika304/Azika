<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Azika Seller</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#071a1a; --card:rgba(255,255,255,.06); --card2:rgba(255,255,255,.1); --solid:#0e2626; --line:rgba(255,255,255,.1);
  --text:#effffb; --muted:#8fb8b0; --a1:#14b8a6; --a2:#2ee6a6; --gold:#ffc83d; --bad:#ff5d73; --vio:#a78bfa; --onA:#042a22;
  --grad:linear-gradient(135deg,#14b8a6 0%,#2ee6a6 100%); --shadow:0 14px 34px rgba(0,0,0,.35); --tabbg:rgba(9,30,30,.9);
}
:root[data-theme=light]{
  --bg:#effaf7; --card:#fff; --card2:#e3f4ef; --solid:#fff; --line:#d3ebe4; --text:#0b2b27; --muted:#5f8a82;
  --shadow:0 12px 26px rgba(20,184,166,.14); --tabbg:rgba(255,255,255,.94);
}
html,body{margin:0;background:var(--bg);color:var(--text);font:600 15px/1.4 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:104px;background:
  radial-gradient(520px 300px at 85% -60px,rgba(46,230,166,.22),transparent 70%),
  radial-gradient(420px 260px at -10% 120px,rgba(20,184,166,.2),transparent 70%),var(--bg);background-attachment:fixed}
header{display:flex;align-items:center;gap:12px;padding:16px 16px 6px;max-width:620px;margin:0 auto}
.logo{width:40px;height:40px;border-radius:13px;background:var(--grad);display:grid;place-items:center;color:var(--onA);font-weight:800;font-size:20px;box-shadow:0 6px 18px rgba(20,184,166,.4)}
header h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:6px}
header small{display:block;color:var(--muted);font-size:12px;font-weight:700}
.ck{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--a2);color:var(--onA);font-size:11px;font-weight:800}
#themeBtn{margin-left:auto;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;display:grid;place-items:center}
#themeBtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{max-width:620px;margin:0 auto;padding:8px 16px}
.sect{display:flex;align-items:baseline;justify-content:space-between;margin:14px 2px 10px}.sect h3{margin:0;font-size:17px;font-weight:800}.sect span{color:var(--muted);font-size:12px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h4{margin:0 0 6px;font-size:15px;font-weight:800}.card p{margin:4px 0;color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 4px}
.kv div{background:var(--card2);border-radius:14px;padding:10px 6px;text-align:center}.kv b{display:block;font-size:18px;font-weight:800}.kv span{font-size:11px;color:var(--muted);font-weight:700}
.kv .g b{color:var(--a2)}.kv .w b{color:var(--gold)}
.btn{display:block;width:100%;border:0;border-radius:15px;padding:14px;background:var(--grad);color:var(--onA);font:800 15px Manrope,sans-serif;cursor:pointer;margin-top:10px;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.98)}.btn[disabled]{opacity:.5}
.btn.ghost{background:var(--card2);color:var(--text)}.btn.bad{background:rgba(255,93,115,.16);color:var(--bad)}
.btn.sm{display:inline-block;width:auto;padding:9px 14px;font-size:13px;margin:8px 8px 0 0;border-radius:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two .btn{margin-top:10px}
.badge{font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--card2);color:var(--muted);white-space:nowrap}
.badge.paid{background:rgba(255,200,61,.16);color:var(--gold)}.badge.delivered{background:rgba(167,139,250,.2);color:var(--vio)}
.badge.done,.badge.active{background:rgba(46,230,166,.16);color:var(--a2)}.badge.dispute,.badge.refunded,.badge.rejected{background:rgba(255,93,115,.16);color:var(--bad)}
.badge.pending{background:rgba(255,200,61,.16);color:var(--gold)}
.ord .h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800}
.ord .m{color:var(--muted);font-size:13px;margin-top:6px}.ord .m b{color:var(--text)}
.ord .gain{color:var(--a2);font-weight:800}
.note{font-size:12px;color:var(--muted);background:var(--card2);border-radius:12px;padding:9px 11px;margin-top:10px}
.of{display:flex;gap:12px;align-items:center}
.of .im{flex:none;width:58px;height:58px;border-radius:14px;background:var(--card2);overflow:hidden;display:grid;place-items:center;font-size:24px}
.of .im img{width:100%;height:100%;object-fit:cover}
.of .tx{flex:1;min-width:0;font-weight:800}.of .tx small{display:block;color:var(--muted);font-weight:700;font-size:12px;margin-top:2px}
.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:596px;margin:0 auto;display:flex;background:var(--tabbg);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;padding:6px;box-shadow:0 14px 38px rgba(0,0,0,.4);z-index:20}
.tabs .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px) / 5);border-radius:20px;background:var(--grad);box-shadow:0 8px 20px rgba(20,184,166,.5);transition:transform .38s cubic-bezier(.3,1.2,.4,1)}
.tabs #tabs{position:relative;z-index:1;display:flex;width:100%}
.tabs button{flex:1;position:relative;background:none;border:0;color:var(--muted);font:800 11px Manrope,sans-serif;padding:8px 0 7px;border-radius:20px;cursor:pointer;text-align:center;transition:color .25s}
.tabs button svg{width:22px;height:22px;display:block;margin:0 auto 2px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.tabs button.on{color:var(--onA)}.tabs button.on svg{transform:translateY(-1px) scale(1.12)}
.tabs i{position:absolute;top:2px;left:55%;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font:800 10px/17px Manrope;text-align:center;font-style:normal;padding:0 4px}
.ov{position:fixed;inset:0;z-index:30;background:rgba(2,12,12,.64);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.ov.show{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:620px;max-height:92vh;overflow-y:auto;background:var(--solid);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.9,.2,1);position:relative}
.ov.show .sheet{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sx{position:absolute;right:14px;top:12px;width:32px;height:32px;border-radius:50%;border:0;background:var(--card2);color:var(--text);font-size:15px;cursor:pointer}
.sh-h h3{margin:0;font-size:19px;font-weight:800;padding-right:34px}.sh-h p{margin:3px 0 12px;color:var(--muted);font-size:13px}
.row{margin-bottom:12px}.row label{display:block;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.4px;margin-bottom:6px}
input.f,textarea.f{width:100%;background:var(--card);border:1.5px solid var(--line);color:var(--text);border-radius:14px;padding:13px 14px;font:600 16px Manrope,sans-serif;outline:none}
input.f:focus,textarea.f:focus{border-color:var(--a1)}textarea.f{resize:none;height:70px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:8px 13px;border-radius:99px;background:var(--card2);font-weight:800;font-size:13px;cursor:pointer;border:1.5px solid transparent}
.chip.on{background:rgba(46,230,166,.16);border-color:var(--a2);color:var(--a2)}
.chat{display:flex;flex-direction:column;gap:8px;height:min(46vh,380px);overflow-y:auto;padding:4px 2px 8px}
.msg{max-width:82%;padding:9px 12px;border-radius:16px;font-size:14px;font-weight:600;word-break:break-word}
.msg.me{align-self:flex-end;background:var(--grad);color:var(--onA);border-bottom-right-radius:5px}
.msg.he{align-self:flex-start;background:var(--card2);border-bottom-left-radius:5px}
.msg small{display:block;opacity:.65;font-size:10px;margin-top:3px;font-weight:700}
/*CHATX*/
.mrow{display:flex;gap:8px;align-items:flex-end;max-width:94%}.mrow.me{align-self:flex-end;flex-direction:row-reverse}.mrow.he{align-self:flex-start}
.mrow .msg{display:block;max-width:none;align-self:auto}
.mav{flex:none;position:relative;width:30px;height:30px;border-radius:50%;overflow:hidden;background:var(--grad);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--onA)}
.mav img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.mav.big{width:44px;height:44px;font-size:18px}
.chh #chAv{flex:none;display:flex}.chh{display:flex;align-items:center;gap:12px;padding-right:34px}.chh h3,.chh p{margin:0}
.tk{margin-left:5px;font-weight:800;letter-spacing:-3px;opacity:.55}.tk.r{opacity:1;color:#055c47}
.cintro{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;font-size:13px;line-height:1.5;font-weight:600}
.cintro b{display:block;font-size:14px;margin-bottom:4px}.cintro ul{margin:6px 0 10px;padding-left:18px}.cintro li{margin-bottom:3px}
.cintro button{border:0;border-radius:12px;padding:9px 18px;background:var(--grad);color:var(--onA);font:800 13px Manrope,sans-serif;cursor:pointer}
.dsc{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}.dsc div{padding:12px 14px;border-radius:14px;background:var(--card2);font-weight:800;font-size:14px;cursor:pointer;border:1.5px solid transparent}
.dsc div.on{border-color:var(--a2);background:rgba(46,230,166,.16)}

.cin{display:flex;gap:8px;margin-top:10px}.cin .f{flex:1}.cin button{flex:none;border:0;border-radius:14px;padding:0 18px;background:var(--grad);color:var(--onA);font:800 20px Manrope,sans-serif;cursor:pointer}
.cli{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.cli .tx{flex:1;min-width:0;font-weight:800}.cli .tx small{display:block;color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cli i{background:var(--bad);color:#fff;border-radius:99px;font-style:normal;font-size:11px;font-weight:800;padding:2px 8px}
.empty{text-align:center;color:var(--muted);padding:34px 10px;font-weight:700}
.err{text-align:center;color:var(--bad);padding:30px 10px;font-weight:700}
.sk{height:84px;border-radius:20px;background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:sk 1.3s infinite;margin-bottom:12px}
@keyframes sk{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:#2a1530;color:#fff;padding:11px 18px;border-radius:14px;font-weight:700;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:.25s;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.ok{background:#0b3d33;color:#b6ffe8}
.big{text-align:center;padding:26px 16px}.big .logo{margin:0 auto 14px;width:64px;height:64px;font-size:30px;border-radius:20px}.big h2{margin:0 0 8px}.big p{color:var(--muted)}
.stars{display:flex;gap:2px;color:var(--gold)}
.rvi{padding:10px 0;border-bottom:1px solid var(--line)}.rvi .t{display:flex;justify-content:space-between;font-weight:800}.rvi .t span{color:var(--gold)}.rvi p{margin:4px 0;color:var(--text);font-weight:500;font-size:14px}.rvi small{color:var(--muted)}
.steps{display:flex;align-items:center;margin-top:12px}
.steps i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;color:var(--muted)}
.steps i.on{background:var(--grad);color:var(--onA)}.steps i.ok{background:var(--a2);color:var(--onA)}
.steps s{flex:1;height:3px;background:var(--card2);border-radius:2px}.steps s.on{background:var(--a1)}
.steps-l{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);font-weight:700;margin-top:4px}
#view{animation:vin .22s ease-out both}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bar{height:10px;border-radius:6px;background:var(--card2);overflow:hidden;margin:10px 0 8px}.bar i{display:block;height:100%;width:0;border-radius:6px;background:var(--grad);transition:width 1s cubic-bezier(.2,.9,.2,1) .25s}
.req{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px;border-bottom:1px solid var(--line)}.req:last-child{border:0}
.req i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;color:var(--muted)}.req.ok i{background:var(--a2);color:var(--onA)}
.req b{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}.req.ok b{color:var(--a2)}
.me{display:flex;gap:14px;align-items:center;margin:6px 2px 16px}
.me .ava{flex:none;width:72px;height:72px;border-radius:24px;background:var(--grad);display:grid;place-items:center;font-size:30px;font-weight:800;color:var(--onA);overflow:hidden;box-shadow:0 8px 22px rgba(20,184,166,.35)}.me .ava img{width:100%;height:100%;object-fit:cover}
.me h3{margin:0;font-size:21px;font-weight:800;display:flex;align-items:center;gap:6px}.me p{margin:2px 0 8px;color:var(--muted);font-size:13px}
.lvl{border:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;margin-top:2px;padding:6px 12px;border-radius:99px;background:rgba(46,230,166,.16);color:var(--a2);font:800 13px Manrope,sans-serif}.lvl.pulse{animation:lvlp 1.6s ease-out infinite}
@keyframes lvlp{0%{box-shadow:0 0 0 0 rgba(46,230,166,.7)}70%{box-shadow:0 0 0 10px rgba(46,230,166,0)}100%{box-shadow:0 0 0 0 rgba(46,230,166,0)}}
.tapme{margin-left:8px;font-size:12px;font-weight:800;color:var(--muted);animation:nudge 1.2s ease-in-out infinite;display:inline-block}
@keyframes nudge{50%{transform:translateX(-4px)}}
.lvl small{font-weight:700;opacity:.75;font-size:11px}
.lvl:active{transform:scale(.96)}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--card2);margin-bottom:8px;opacity:.65}.lrow.on{opacity:1}.lrow.cur{outline:2px solid var(--a2)}
.lrow .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:13px}.lrow.on .n{background:var(--a2);color:var(--onA)}
.lrow b{display:block;font-size:14px}.lrow small{display:block;color:var(--muted);font-size:12px;font-weight:600}.lrow em{margin-left:auto;font-style:normal;font-size:11px;font-weight:800;color:var(--a2)}
.lv{display:flex;gap:6px;margin:10px 0 0}.lv span{flex:1;text-align:center;background:var(--card2);border-radius:12px;padding:8px 2px;font-size:11px;font-weight:800;color:var(--muted)}.lv span.on{background:rgba(46,230,166,.16);color:var(--a2)}.lv span.cur{outline:2px solid var(--a2)}
.logo{animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 6px 26px rgba(46,230,166,.65);transform:scale(1.04)}}
.badge.paid{animation:blink 1.8s ease-in-out infinite}
@keyframes blink{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo">A</div>
  <div><h1>Azika Seller <span id="vk"></span></h1><small id="sub">кабинет продавца</small></div>
  <button id="themeBtn" aria-label="Тема"></button>
</header>
<main id="view"></main>
<nav class="tabs"><div class="ind" id="ind"></div><div id="tabs"></div></nav>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
const params = new URLSearchParams(location.search);
let API = (params.get("api") || store("api") || "https://92-243-74-80.sslip.io:8443/shop").replace(/\/$/, "");
if (params.get("api")) store("api", API);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const haptic = (t = "light") => { try { tg.HapticFeedback.impactOccurred(t); } catch (e) {} };
const plural = (n, a, b, c) => { n = Math.abs(n) % 100; const m = n % 10; return n > 10 && n < 20 ? c : m > 1 && m < 5 ? b : m === 1 ? a : c; };
const STAR = "⭐";
let S = { tab: "orders", me: null, games: [], fee: 5, adPrice: 30, promoMax: 50, chatT: null };

/* ответ сервера может быть от старой версии — достраиваем уровень сами */
const DEF_LV = [["Новичок", 0, 0, 0, 10, 3], ["Продавец", 5, 0, 0, 8, 10], ["Профи", 20, 5, 4.5, 6, 30], ["Топ-продавец", 50, 10, 4.7, 4, 100]]
  .map((l, i) => ({ level: i + 1, name: l[0], deals: l[1], reviews: l[2], avg: l[3], fee: l[4], limit: l[5] }));
function fixMe(m) {
  if (!m || !m.ok) return m;
  m.offers = m.offers || [];
  if (!m.level) {
    let c = 0; DEF_LV.forEach((l, i) => { if ((m.deals || 0) >= l.deals && (m.reviews || 0) >= l.reviews && (!l.avg || (m.avg || 0) >= l.avg)) c = i; });
    m.level = { ...DEF_LV[c], deals: m.deals || 0, reviews: m.reviews || 0, avg: m.avg || 0, levels: DEF_LV };
    m.fee = DEF_LV[c].fee;
  }
  if (m.offers_used == null) m.offers_used = m.offers.filter(o => ["pending", "active", "hidden"].includes(o.status)).length;
  return m;
}

/* тема */
const SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>';
function applyTheme(t) { document.documentElement.dataset.theme = t; $("#themeBtn").innerHTML = t === "dark" ? SUN : MOON;
  const c = t === "dark" ? "#071a1a" : "#effaf7"; try { tg.setHeaderColor(c); tg.setBackgroundColor(c); } catch (e) {} }
applyTheme(store("theme") || "dark");
$("#themeBtn").onclick = () => { const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; store("theme", t); applyTheme(t); haptic(); };

function toast(msg, ok) { const t = $("#toast"); t.textContent = msg; t.className = "toast show" + (ok ? " ok" : ""); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 3200); }
async function api(path, body) {
  const opt = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...body, initData: tg ? tg.initData : "" }) };
  const r = await fetch(API + path, opt);
  return r.json();
}
const view = h => {
  const v = $("#view"); v.innerHTML = h; window.scrollTo(0, 0);
  v.style.animation = "none"; void v.offsetWidth; v.style.animation = ""; S.dir = 0;
};
function fmtLeft(sec) { const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600); return d ? `${d} дн. ${h} ч` : h ? `${h} ч` : "менее часа"; }

/* шторка */
function stopChat() { clearInterval(S.chatT); S.chatT = null; }
function sheetOpen(html) { stopChat(); $("#sheet").innerHTML = `<div class="grab"></div><button class="sx" id="sx" aria-label="Закрыть">✕</button>` + html;
  $("#sx").onclick = closeSheet; $("#ov").classList.add("show"); }
function closeSheet() { stopChat(); $("#ov").classList.remove("show"); }

function resizeImg(file, max = 900) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg", .82)); };
    img.onerror = () => rej(new Error("Не удалось открыть фото")); img.src = u;
  });
}

    const r = await api("/api/chat/messages", { order }); if (!r.ok || !$("#chBox")) return;
    if (r.peer) { $("#chT").textContent = r.peer; peerName = r.peer; }
    if (!hdr && $("#chAv")) { $("#chAv").innerHTML = avEl(r.peer_av, r.peer, "big"); hdr = true; }
    const sig = r.messages.map(m => m.id + (m.read ? "r" : "")).join(","); if (sig === last) return; last = sig;
    const box = $("#chBox"), end = box.scrollHeight - box.scrollTop - box.clientHeight < 60 || !box.dataset.ok;
    box.innerHTML = r.messages.length ? r.messages.map(m => `<div class="mrow ${m.mine ? "me" : "he"}">${avEl(m.av, m.mine ? (me.first_name || S.me && S.me.name) : peerName)}<div class="msg ${m.mine ? "me" : "he"}">${esc(m.text)}<small>${esc(m.time)}${m.mine ? `<span class="tk ${m.read ? "r" : ""}">${m.read ? "✓✓" : "✓"}</span>` : ""}</small></div></div>`).join("") : '<div class="empty" style="padding:30px 10px">Сообщений пока нет</div>';
    box.dataset.ok = 1; if (end) box.scrollTop = box.scrollHeight; } catch (e) {} };
  await load(); S.chatT = setInterval(load, 4000);
  const send = async () => { const t = $("#chIn").value.trim(); if (!t) return; $("#chIn").value = "";
    try { const r = await api("/api/chat/send", { order, text: t }); if (!r.ok) { toast(r.msg || "Не отправилось"); $("#chIn").value = t; } else { haptic(); last = ""; load(); } } catch (e) { toast("Нет связи"); $("#chIn").value = t; } };
  $("#chSend").onclick = send; $("#chIn").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
}

/* ---------- Баланс ---------- */
async function showMoney() {
  view('<div class="sk"></div>');
  let me; try { me = fixMe(await api("/api/seller/me", {})); if (!me.ok) throw 0; S.me = me; } catch (e) { view('<div class="err">Нет связи</div>'); return; }
  const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user || {};
  const nm = me.name || u.first_name || "Продавец", L = sellerLevel(me);
  view(`<div class="me"><div class="ava">${u.photo_url ? `<img src="${esc(u.photo_url)}" alt="">` : esc(nm.slice(0, 1).toUpperCase())}</div>
      <div><h3>${esc(nm)} ${me.verified ? '<span class="ck">✓</span>' : ""}</h3><p>${u.username ? "@" + esc(u.username) + " · " : ""}ID ${me.id}</p><button class="lvl ${store("lvl_seen2") ? "" : "pulse"}" id="lvl">⚡ ${esc(L.cur.name)} <small>· ком. ${L.cur.fee}%</small> ›</button>${store("lvl_seen2") ? "" : '<span class="tapme">👈 нажми</span>'}</div></div>
    <div class="card"><h4>Баланс</h4><div class="kv"><div class="g"><b>${me.balance}</b><span>доступно ⭐</span></div><div class="w"><b>${me.escrow || 0}</b><span>в сделках ⭐</span></div><div><b>${me.earned}</b><span>заработано ⭐</span></div></div>
    <p>«В сделках» — деньги покупателей, которые держит магазин до подтверждения получения.${me.pending_payout ? `<br>На выводе: <b>${me.pending_payout} ⭐</b> (ждёт админа)` : ""}</p>
    <button class="btn" id="po">💸 Вывести</button></div>
    <div class="card"><h4>Мой профиль</h4><div class="kv"><div><b>${me.deals}</b><span>сделок</span></div><div><b>${me.reviews ? "★ " + me.avg : "—"}</b><span>рейтинг</span></div><div><b>${me.reviews}</b><span>отзывов</span></div></div>
      ${me.verified ? '<p><span class="ck">✓</span> Ты проверенный продавец — галочка видна покупателям.</p>' : '<p>Галочку ✓ админ выдаёт продавцам с хорошим рейтингом и количеством выполненных сделок.</p>'}
      <button class="btn ghost" id="rv">⭐ Мои отзывы</button></div>
    <button class="btn ghost" id="sup" style="margin-bottom:12px">🆘 Поддержка</button>
    <div class="note" style="text-align:center;opacity:.6;margin-bottom:8px">Azika Seller · версия 3</div>
    <div class="note">Твоя комиссия магазина ${me.fee}% (уровень «${esc(me.level.name)}», чем выше уровень — тем меньше). Минимальный вывод ${me.payout_min} ⭐. Выплата вручную через администратора.</div>`);
  $("#lvl").onclick = () => { haptic(); store("lvl_seen2", "1"); $("#lvl").classList.remove("pulse"); const t = document.querySelector(".tapme"); if (t) t.remove(); levelSheet(me); };
  $("#po").onclick = () => payoutForm(me);
  $("#sup").onclick = () => { const u = "https://t.me/" + (S.support || "@azikashop_support_bot").replace(/^@/, "") + "?start=seller"; tg && tg.openTelegramLink ? tg.openTelegramLink(u) : window.open(u, "_blank"); };
  $("#rv").onclick = openReviews;
}
function sellerLevel(me) {
  const lv = me.level, lvs = lv.levels, cur = lv.level - 1, nx = lvs[cur + 1];
  const reqs = nx ? [[`Сделок: ${lv.deals} из ${nx.deals}`, lv.deals >= nx.deals, `ещё ${Math.max(0, nx.deals - lv.deals)}`]]
    .concat(nx.reviews ? [[`Отзывов: ${lv.reviews} из ${nx.reviews}`, lv.reviews >= nx.reviews, `ещё ${Math.max(0, nx.reviews - lv.reviews)}`]] : [])
    .concat(nx.avg ? [[`Рейтинг от ${nx.avg}: сейчас ${lv.reviews ? lv.avg : "—"}`, lv.reviews > 0 && lv.avg >= nx.avg, lv.avg >= nx.avg ? "ок" : "нужно выше"]] : []) : [];
  const pct = nx ? Math.round(100 * Math.min(1, lv.deals / nx.deals)) : 100;
  return { lv: cur, cur: lvs[cur], nx, reqs, pct, lvs };
}
const perks = l => `комиссия ${l.fee}% · до ${l.limit} объявлений`;
function levelSheet(me) {
  const L = sellerLevel(me), used = me.offers_used || 0;
  const need = l => [l.deals ? `${l.deals} сделок` : "", l.reviews ? `${l.reviews} отзывов` : "", l.avg ? `рейтинг от ${l.avg}` : ""].filter(Boolean).join(" · ") || "после одобрения заявки";
  sheetOpen(`<div class="sh-h"><div><h3>⚡ ${esc(L.cur.name)}</h3><p>Уровень ${L.lv + 1} из ${L.lvs.length}</p></div></div>
    <div class="kv" style="grid-template-columns:1fr 1fr"><div class="g"><b>${L.cur.fee}%</b><span>твоя комиссия</span></div><div><b>${used} / ${L.cur.limit}</b><span>объявлений</span></div></div>
    <div class="bar"><i data-w="${L.pct}"></i></div>
    ${L.nx ? `<p class="hint" style="margin:0 0 6px">До уровня «${esc(L.nx.name)}» (комиссия ${L.nx.fee}%, до ${L.nx.limit} объявлений):</p>${L.reqs.map(r => `<div class="req ${r[1] ? "ok" : ""}"><i>${r[1] ? "✓" : "•"}</i>${r[0]}<b>${r[2]}</b></div>`).join("")}`
      : `<div class="note">🏆 Максимальный уровень: самая низкая комиссия и максимум объявлений! ${me.verified ? "Галочка ✓ у тебя уже есть." : "Напиши в поддержку — админ может выдать галочку ✓."}</div>`}
    <h4 style="margin:18px 0 8px">Все уровни</h4>
    ${L.lvs.map((l, i) => `<div class="lrow ${i <= L.lv ? "on" : ""} ${i === L.lv ? "cur" : ""}"><span class="n">${i < L.lv ? "✓" : i + 1}</span><div><b>${esc(l.name)}</b><small>${need(l)}</small><small style="color:var(--a2)">${perks(l)}</small></div>${i === L.lv ? "<em>ты здесь</em>" : ""}</div>`).join("")}
    <div class="note" style="margin-top:12px"><b>Как поднять уровень:</b> выдавай товар быстро и честно — сделка считается после подтверждения покупателем. Проси покупателей оставлять отзывы: в магазине «Заказы» → «Оставить отзыв». Чем выше уровень, тем меньше комиссия магазина и больше объявлений. Галочку ✓ админ выдаёт проверенным продавцам (обычно от 10 отзывов с рейтингом 4.7+).</div>`);
  setTimeout(() => document.querySelectorAll(".bar i[data-w]").forEach(i => i.style.width = i.dataset.w + "%"), 80);
}
function payoutForm(me) {
  sheetOpen(`<div class="sh-h"><div><h3>Вывод средств</h3><p>Доступно ${me.balance} ⭐ · минимум ${me.payout_min} ⭐</p></div></div>
    <div class="row"><label>СУММА, ⭐</label><input class="f" id="poS" inputmode="numeric" value="${me.balance >= me.payout_min ? me.balance : ""}"></div>
    <div class="row"><label>КУДА ВЫПЛАТИТЬ</label><textarea class="f" id="poD" maxlength="200" placeholder="Карта, кошелёк или @username"></textarea></div>
    <button class="btn" id="poSend">Запросить вывод</button>`);
  $("#poSend").onclick = async () => {
    try { const r = await api("/api/seller/payout", { stars: +$("#poS").value.replace(/\D/g, ""), details: $("#poD").value.trim() });
      if (!r.ok) { toast(r.msg || "Ошибка"); return; } closeSheet(); toast("Запрос отправлен админу", true); showMoney(); } catch (e) { toast("Нет связи"); }
  };
}
async function openReviews() {
  sheetOpen('<div class="sk" style="height:120px"></div>');
  try {
    const r = await api("/api/reviews?seller=" + S.me.id);
    $("#sheet").innerHTML = `<div class="grab"></div><button class="sx" id="sx">✕</button><div class="sh-h"><div><h3>Мои отзывы</h3><p>${r.count ? `★ ${r.avg} · ${r.count} ${plural(r.count, "отзыв", "отзыва", "отзывов")}` : "Пока нет отзывов"}</p></div></div>`
      + (r.reviews.length ? r.reviews.map(v => `<div class="rvi"><div class="t"><b>${esc(v.name)}</b><span>${"★".repeat(v.rating)}${"☆".repeat(5 - v.rating)}</span></div>${v.text ? `<p>${esc(v.text)}</p>` : ""}<small>${esc(v.label)} · ${esc(v.date)}</small></div>`).join("") : '<div class="empty">Отзывы появятся после выполненных заказов</div>');
    $("#sx").onclick = closeSheet;
  } catch (e) { $("#sheet").innerHTML = '<div class="err">Нет связи</div>'; }
}
boot();
</script>
</body>
</html>
