<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Azika Seller</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#071a1a; --card:rgba(255,255,255,.06); --card2:rgba(255,255,255,.1); --solid:#0e2626; --line:rgba(255,255,255,.1);
  --text:#effffb; --muted:#8fb8b0; --a1:#14b8a6; --a2:#2ee6a6; --gold:#ffc83d; --bad:#ff5d73; --vio:#a78bfa; --onA:#042a22;
  --grad:linear-gradient(135deg,#14b8a6 0%,#2ee6a6 100%); --shadow:0 14px 34px rgba(0,0,0,.35); --tabbg:rgba(9,30,30,.9);
}
:root[data-theme=light]{
  --bg:#effaf7; --card:#fff; --card2:#e3f4ef; --solid:#fff; --line:#d3ebe4; --text:#0b2b27; --muted:#5f8a82;
  --shadow:0 12px 26px rgba(20,184,166,.14); --tabbg:rgba(255,255,255,.94);
}
html,body{margin:0;background:var(--bg);color:var(--text);font:600 15px/1.4 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:90px;background:
  radial-gradient(520px 300px at 85% -60px,rgba(46,230,166,.22),transparent 70%),
  radial-gradient(420px 260px at -10% 120px,rgba(20,184,166,.2),transparent 70%),var(--bg);background-attachment:fixed}
header{display:flex;align-items:center;gap:12px;padding:16px 16px 6px;max-width:620px;margin:0 auto}
.logo{width:40px;height:40px;border-radius:13px;background:var(--grad);display:grid;place-items:center;color:var(--onA);font-weight:800;font-size:20px;box-shadow:0 6px 18px rgba(20,184,166,.4)}
header h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:6px}
header small{display:block;color:var(--muted);font-size:12px;font-weight:700}
.ck{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--a2);color:var(--onA);font-size:11px;font-weight:800}
#themeBtn{margin-left:auto;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;display:grid;place-items:center}
#themeBtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{max-width:620px;margin:0 auto;padding:8px 16px}
.sect{display:flex;align-items:baseline;justify-content:space-between;margin:14px 2px 10px}.sect h3{margin:0;font-size:17px;font-weight:800}.sect span{color:var(--muted);font-size:12px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h4{margin:0 0 6px;font-size:15px;font-weight:800}.card p{margin:4px 0;color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 4px}
.kv div{background:var(--card2);border-radius:14px;padding:10px 6px;text-align:center}.kv b{display:block;font-size:18px;font-weight:800}.kv span{font-size:11px;color:var(--muted);font-weight:700}
.kv .g b{color:var(--a2)}.kv .w b{color:var(--gold)}
.btn{display:block;width:100%;border:0;border-radius:15px;padding:14px;background:var(--grad);color:var(--onA);font:800 15px Manrope,sans-serif;cursor:pointer;margin-top:10px;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.98)}.btn[disabled]{opacity:.5}
.btn.ghost{background:var(--card2);color:var(--text)}.btn.bad{background:rgba(255,93,115,.16);color:var(--bad)}
.btn.sm{display:inline-block;width:auto;padding:9px 14px;font-size:13px;margin:8px 8px 0 0;border-radius:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two .btn{margin-top:10px}
.badge{font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--card2);color:var(--muted);white-space:nowrap}
.badge.paid{background:rgba(255,200,61,.16);color:var(--gold)}.badge.delivered{background:rgba(167,139,250,.2);color:var(--vio)}
.badge.done,.badge.active{background:rgba(46,230,166,.16);color:var(--a2)}.badge.dispute,.badge.refunded,.badge.rejected{background:rgba(255,93,115,.16);color:var(--bad)}
.badge.pending{background:rgba(255,200,61,.16);color:var(--gold)}
.ord .h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800}
.ord .m{color:var(--muted);font-size:13px;margin-top:6px}.ord .m b{color:var(--text)}
.ord .gain{color:var(--a2);font-weight:800}
.note{font-size:12px;color:var(--muted);background:var(--card2);border-radius:12px;padding:9px 11px;margin-top:10px}
.of{display:flex;gap:12px;align-items:center}
.of .im{flex:none;width:58px;height:58px;border-radius:14px;background:var(--card2);overflow:hidden;display:grid;place-items:center;font-size:24px}
.of .im img{width:100%;height:100%;object-fit:cover}
.of .tx{flex:1;min-width:0;font-weight:800}.of .tx small{display:block;color:var(--muted);font-weight:700;font-size:12px;margin-top:2px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:var(--tabbg);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
.tabs div{max-width:620px;width:100%;display:flex}
.tabs button{flex:1;position:relative;background:none;border:0;color:var(--muted);font:800 10.5px Manrope,sans-serif;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--a2)}
.tabs i{position:absolute;top:1px;left:54%;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font:800 10px/17px Manrope;text-align:center;font-style:normal;padding:0 4px}
.ov{position:fixed;inset:0;z-index:30;background:rgba(2,12,12,.64);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.ov.show{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:620px;max-height:92vh;overflow-y:auto;background:var(--solid);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.9,.2,1);position:relative}
.ov.show .sheet{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sx{position:absolute;right:14px;top:12px;width:32px;height:32px;border-radius:50%;border:0;background:var(--card2);color:var(--text);font-size:15px;cursor:pointer}
.sh-h h3{margin:0;font-size:19px;font-weight:800;padding-right:34px}.sh-h p{margin:3px 0 12px;color:var(--muted);font-size:13px}
.row{margin-bottom:12px}.row label{display:block;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.4px;margin-bottom:6px}
input.f,textarea.f{width:100%;background:var(--card);border:1.5px solid var(--line);color:var(--text);border-radius:14px;padding:13px 14px;font:600 16px Manrope,sans-serif;outline:none}
input.f:focus,textarea.f:focus{border-color:var(--a1)}textarea.f{resize:none;height:70px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:8px 13px;border-radius:99px;background:var(--card2);font-weight:800;font-size:13px;cursor:pointer;border:1.5px solid transparent}
.chip.on{background:rgba(46,230,166,.16);border-color:var(--a2);color:var(--a2)}
.chat{display:flex;flex-direction:column;gap:8px;height:min(46vh,380px);overflow-y:auto;padding:4px 2px 8px}
.msg{max-width:82%;padding:9px 12px;border-radius:16px;font-size:14px;font-weight:600;word-break:break-word}
.msg.me{align-self:flex-end;background:var(--grad);color:var(--onA);border-bottom-right-radius:5px}
.msg.he{align-self:flex-start;background:var(--card2);border-bottom-left-radius:5px}
.msg small{display:block;opacity:.65;font-size:10px;margin-top:3px;font-weight:700}
.cin{display:flex;gap:8px;margin-top:10px}.cin .f{flex:1}.cin button{flex:none;border:0;border-radius:14px;padding:0 18px;background:var(--grad);color:var(--onA);font:800 20px Manrope,sans-serif;cursor:pointer}
.cli{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.cli .tx{flex:1;min-width:0;font-weight:800}.cli .tx small{display:block;color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cli i{background:var(--bad);color:#fff;border-radius:99px;font-style:normal;font-size:11px;font-weight:800;padding:2px 8px}
.empty{text-align:center;color:var(--muted);padding:34px 10px;font-weight:700}
.err{text-align:center;color:var(--bad);padding:30px 10px;font-weight:700}
.sk{height:84px;border-radius:20px;background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:sk 1.3s infinite;margin-bottom:12px}
@keyframes sk{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:#2a1530;color:#fff;padding:11px 18px;border-radius:14px;font-weight:700;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:.25s;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.ok{background:#0b3d33;color:#b6ffe8}
.big{text-align:center;padding:26px 16px}.big .logo{margin:0 auto 14px;width:64px;height:64px;font-size:30px;border-radius:20px}.big h2{margin:0 0 8px}.big p{color:var(--muted)}
.stars{display:flex;gap:2px;color:var(--gold)}
.rvi{padding:10px 0;border-bottom:1px solid var(--line)}.rvi .t{display:flex;justify-content:space-between;font-weight:800}.rvi .t span{color:var(--gold)}.rvi p{margin:4px 0;color:var(--text);font-weight:500;font-size:14px}.rvi small{color:var(--muted)}
.steps{display:flex;align-items:center;margin-top:12px}
.steps i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;color:var(--muted)}
.steps i.on{background:var(--grad);color:var(--onA)}.steps i.ok{background:var(--a2);color:var(--onA)}
.steps s{flex:1;height:3px;background:var(--card2);border-radius:2px}.steps s.on{background:var(--a1)}
.steps-l{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);font-weight:700;margin-top:4px}
</style>
</head>
<body>
<header>
  <div class="logo">A</div>
  <div><h1>Azika Seller <span id="vk"></span></h1><small id="sub">кабинет продавца</small></div>
  <button id="themeBtn" aria-label="Тема"></button>
</header>
<main id="view"></main>
<nav class="tabs"><div id="tabs"></div></nav>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
const params = new URLSearchParams(location.search);
let API = (params.get("api") || store("api") || "https://92-243-74-80.sslip.io:8443/shop").replace(/\/$/, "");
if (params.get("api")) store("api", API);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const haptic = (t = "light") => { try { tg.HapticFeedback.impactOccurred(t); } catch (e) {} };
const plural = (n, a, b, c) => { n = Math.abs(n) % 100; const m = n % 10; return n > 10 && n < 20 ? c : m > 1 && m < 5 ? b : m === 1 ? a : c; };
const STAR = "⭐";
let S = { tab: "orders", me: null, games: [], fee: 5, adPrice: 30, promoMax: 50, chatT: null };

/* тема */
const SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>';
function applyTheme(t) { document.documentElement.dataset.theme = t; $("#themeBtn").innerHTML = t === "dark" ? SUN : MOON;
  const c = t === "dark" ? "#071a1a" : "#effaf7"; try { tg.setHeaderColor(c); tg.setBackgroundColor(c); } catch (e) {} }
applyTheme(store("theme") || "dark");
$("#themeBtn").onclick = () => { const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; store("theme", t); applyTheme(t); haptic(); };

function toast(msg, ok) { const t = $("#toast"); t.textContent = msg; t.className = "toast show" + (ok ? " ok" : ""); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 3200); }
async function api(path, body) {
  const opt = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...body, initData: tg ? tg.initData : "" }) };
  const r = await fetch(API + path, opt);
  return r.json();
}
const view = h => { $("#view").innerHTML = h; window.scrollTo(0, 0); };
function fmtLeft(sec) { const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600); return d ? `${d} дн. ${h} ч` : h ? `${h} ч` : "менее часа"; }

/* шторка */
function stopChat() { clearInterval(S.chatT); S.chatT = null; }
function sheetOpen(html) { stopChat(); $("#sheet").innerHTML = `<div class="grab"></div><button class="sx" id="sx" aria-label="Закрыть">✕</button>` + html;
  $("#sx").onclick = closeSheet; $("#ov").classList.add("show"); }
function closeSheet() { stopChat(); $("#ov").classList.remove("show"); }
$("#ov").onclick = e => { if (e.target.id === "ov") closeSheet(); };

/* вкладки */
const ICO = {
  orders: '<path d="M6 2l-2 4v14a2 2 0 002 2h12a2 2 0 002-2V6l-2-4z"/><path d="M4 6h16M16 10a4 4 0 01-8 0"/>',
  offers: '<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  promos: '<path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.4"/>',
  chats: '<path d="M21 12a8 8 0 01-11.6 7.1L3 21l1.9-5.4A8 8 0 1121 12z"/>',
  money: '<rect x="2" y="6" width="20" height="13" rx="3"/><path d="M2 10h20M6 15h4"/>'
};
function drawTabs() {
  const T = [["orders", "Заказы"], ["offers", "Товары"], ["promos", "Промо"], ["chats", "Чаты"], ["money", "Баланс"]];
  const un = S.me ? S.me.unread || 0 : 0;
  $("#tabs").innerHTML = T.map(([k, l]) => `<button data-t="${k}" class="${S.tab === k ? "on" : ""}"><svg viewBox="0 0 24 24">${ICO[k]}</svg>${l}${k === "chats" && un ? `<i>${un}</i>` : ""}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { haptic(); S.tab = b.dataset.t; go(); });
}
function go() { drawTabs(); ({ orders: showOrders, offers: showOffers, promos: showPromos, chats: showChats, money: showMoney })[S.tab](); }

/* старт */
async function boot() {
  view('<div class="sk"></div><div class="sk"></div>');
  try {
    const [c, m] = await Promise.all([api("/api/catalog"), api("/api/seller/me", {})]);
    if (c && c.ok) { S.games = (c.games || []).filter(g => g.id); S.fee = c.seller_fee || 5; S.adPrice = c.ad_price || 30; S.shop = c.shop; S.bot = c.bot_username; }
    if (!m || !m.ok) throw new Error(m && m.msg || "Открой приложение из бота Azika Sellers");
    S.me = m;
    if (m.status !== "approved") return noAccess(m.status);
    $("#vk").innerHTML = m.verified ? '<span class="ck" title="Проверенный продавец">✓</span>' : "";
    $("#sub").textContent = m.name || "кабинет продавца";
    go();
  } catch (e) { view(`<div class="err">${esc(e.message || "Нет связи с сервером")}<br><button class="btn ghost" onclick="boot()">Повторить</button></div>`); $("#tabs").innerHTML = ""; }
}
function noAccess(st) {
  $("#tabs").innerHTML = "";
  const t = { none: ["Доступ по заявке", "Чтобы продавать, подай заявку в магазине: Профиль → «Подать заявку». После одобрения Azika Seller откроется."],
    pending: ["Заявка на рассмотрении", "Админ проверяет заявку. Мы пришлём сообщение, как только её рассмотрят."],
    banned: ["Доступ закрыт", "Продажи для этого аккаунта закрыты."] }[st] || ["Нет доступа", ""];
  view(`<div class="card big"><div class="logo">A</div><h2>${t[0]}</h2><p>${t[1]}</p></div>`);
}

/* ---------- Заказы ---------- */
async function showOrders() {
  view('<div class="sk"></div><div class="sk"></div>');
  try {
    const r = await api("/api/seller/orders", {}); if (!r.ok) throw new Error(r.msg || "Ошибка");
    const need = r.orders.filter(o => o.status === "paid"), rest = r.orders.filter(o => o.status !== "paid");
    const card = o => {
      const n = { paid: 1, delivered: 2, dispute: 2, done: 3, refunded: 0 }[o.status] || 0;
      return `<div class="card ord"><div class="h"><span>#${o.id} · ${esc(o.game)}</span><span class="badge ${esc(o.status)}">${esc(o.status_text)}</span></div>
        <div class="m"><b>${esc(o.label)}</b> · ${o.stars} ⭐ · тебе <span class="gain">${o.gain} ⭐</span><br>Игрок / аккаунт: <b>${esc(o.player || "—")}</b>${o.comment ? `<br>Комментарий: ${esc(o.comment)}` : ""}<br>${esc(o.created)}</div>
        ${o.status === "refunded" ? "" : `<div class="steps"><i class="${n >= 1 ? "ok" : ""}">✓</i><s class="${n >= 2 ? "on" : ""}"></s><i class="${n >= 3 ? "ok" : n === 2 ? "on" : ""}">${n >= 3 ? "✓" : "2"}</i><s class="${n >= 3 ? "on" : ""}"></s><i class="${n >= 3 ? "ok" : ""}">${n >= 3 ? "✓" : "3"}</i></div>
        <div class="steps-l"><span>Оплачено</span><span>Передано</span><span>Подтверждено</span></div>`}
        ${o.status === "paid" ? `<div class="note">💰 Покупатель оплатил, деньги у магазина. Передай товар и нажми «Передал».</div>` : ""}
        ${o.status === "delivered" ? `<div class="note">⏳ Ждём подтверждения покупателя${o.auto_in ? ` — иначе автоматически через ${fmtLeft(o.auto_in)}` : ""}. Деньги придут на баланс.</div>` : ""}
        ${o.status === "dispute" ? `<div class="note">⚠️ Покупатель открыл спор. Деньги заморожены — решает поддержка.</div>` : ""}
        ${o.status === "done" ? `<div class="note">✅ +${o.gain} ⭐ зачислено на баланс.</div>` : ""}
        <div>${o.status === "paid" ? `<button class="btn sm" data-dl="${o.id}">📦 Передал товар</button>` : ""}${o.chat ? `<button class="btn sm ghost" data-ch="${o.id}" data-l="${esc(o.label)}">💬 Чат${o.unread ? ` · ${o.unread}` : ""}</button>` : ""}</div></div>`;
    };
    view(`<div class="sect"><h3>Нужно выдать</h3><span>${need.length}</span></div>` + (need.length ? need.map(card).join("") : '<div class="empty">Новых оплаченных заказов нет</div>')
      + (rest.length ? `<div class="sect"><h3>История</h3><span>${rest.length}</span></div>` + rest.map(card).join("") : "")
      + `<div class="note" style="margin-top:6px">Схема сделки: покупатель платит → деньги держит магазин → ты выдаёшь и жмёшь «Передал» → покупатель подтверждает (или через ${r.auto_days} дн. подтверждение автоматическое) → деньги на твоём балансе.</div>`);
    document.querySelectorAll("[data-dl]").forEach(b => b.onclick = async () => {
      if (!confirm("Ты точно выдал товар? Покупателю уйдёт запрос на подтверждение.")) return; b.disabled = true;
      try { const x = await api("/api/seller/deliver", { order: +b.dataset.dl }); toast(x.msg || (x.ok ? "Готово" : "Ошибка"), x.ok); haptic("medium"); showOrders(); } catch (e) { toast(e.message || "Нет связи"); b.disabled = false; }
    });
    document.querySelectorAll("[data-ch]").forEach(b => b.onclick = () => openChat(+b.dataset.ch, "Покупатель", b.dataset.l));
  } catch (e) { view(`<div class="err">${esc(e.message)}<br><button class="btn ghost" onclick="showOrders()">Повторить</button></div>`); }
}

/* ---------- Товары ---------- */
const OFS = { active: "в продаже", pending: "на проверке", hidden: "скрыт", rejected: "отклонён" };
async function showOffers() {
  view('<div class="sk"></div>');
  try { const r = await api("/api/seller/me", {}); if (!r.ok) throw 0; S.me = r; } catch (e) { view('<div class="err">Нет связи</div>'); return; }
  const o = S.me.offers;
  view(`<div class="sect"><h3>Мои товары</h3><span>${o.length}</span></div><button class="btn" id="add" style="margin-top:0">➕ Выставить объявление</button><div style="height:14px"></div>`
    + (o.length ? o.map(x => `<div class="card"><div class="of"><div class="im">📦<img src="${esc(API + "/api/img/" + x.id)}" alt="" onerror="this.remove()"></div>
      <div class="tx">${esc(x.title)}<small>${esc((S.games.find(g => g.id === x.game) || {}).name || x.game)} · ${x.stars} ⭐ · продано ${x.sold}</small></div>
      <span class="badge ${esc(x.status)}">${OFS[x.status] || esc(x.status)}</span></div>
      ${x.ad ? '<div class="note">📢 Реклама включена — товар в топе с меткой «Реклама»</div>' : ""}
      <div><button class="btn sm ghost" data-e="${esc(x.id)}">✏️ Изменить</button>${x.status === "active" ? `<button class="btn sm ghost" data-ad="${esc(x.id)}">📢 Реклама</button><button class="btn sm ghost" data-a="hide" data-id="${esc(x.id)}">🙈 Скрыть</button>` : ""}${x.status === "hidden" ? `<button class="btn sm ghost" data-a="show" data-id="${esc(x.id)}">👁 Показать</button>` : ""}<button class="btn sm bad" data-a="delete" data-id="${esc(x.id)}">Удалить</button></div></div>`).join("")
      : '<div class="empty">Объявлений пока нет.<br>Выставь первое — после проверки оно появится в магазине.</div>'));
  $("#add").onclick = () => offerForm();
  document.querySelectorAll("[data-e]").forEach(b => b.onclick = () => offerForm(o.find(x => x.id === b.dataset.e)));
  document.querySelectorAll("[data-ad]").forEach(b => b.onclick = () => adSheet(b.dataset.ad));
  document.querySelectorAll("[data-a]").forEach(b => b.onclick = async () => {
    if (b.dataset.a === "delete" && !confirm("Удалить товар?")) return;
    try { const x = await api("/api/seller/offer_set", { id: b.dataset.id, action: b.dataset.a }); x.ok ? (haptic(), showOffers()) : toast(x.msg || "Ошибка"); } catch (e) { toast("Нет связи"); }
  });
}
function resizeImg(file, max = 900) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg", .82)); };
    img.onerror = () => rej(new Error("Не удалось открыть фото")); img.src = u;
  });
}
function offerForm(ed) {
  let game = ed ? ed.game : (S.games[0] || {}).id, photo = null;
  sheetOpen(`<div class="sh-h"><div><h3>${ed ? "Изменить товар" : "Новое объявление"}</h3><p>${ed ? "Цену можно менять сразу, текст проверит админ" : "Появится в магазине после проверки"}</p></div></div>
    ${ed ? "" : `<div class="row"><label>ИГРА</label><div class="chips" id="ofg">${S.games.map(g => `<div class="chip ${g.id === game ? "on" : ""}" data-g="${esc(g.id)}">${esc(g.name)}</div>`).join("")}</div></div>`}
    <div class="row"><label>НАЗВАНИЕ</label><input class="f" id="ofT" maxlength="60" placeholder="Например: 500 гемов за 10 минут" value="${esc(ed ? ed.title : "")}"></div>
    <div class="row"><label>ОПИСАНИЕ</label><textarea class="f" id="ofD" maxlength="300" placeholder="Что входит, как выдаёшь, сроки">${esc(ed ? ed.desc : "")}</textarea></div>
    <div class="row"><label>ЦЕНА, ⭐</label><input class="f" id="ofP" inputmode="numeric" placeholder="например 900" value="${ed ? ed.stars : ""}"><div class="hint" id="ofH">Комиссия магазина ${S.fee}%</div></div>
    <div class="row"><label>ФОТО (НЕОБЯЗАТЕЛЬНО)</label><input type="file" id="ofF" accept="image/*" class="f"><div class="hint" id="ofFh">Покажи, что именно продаёшь — скриншот или картинка</div></div>
    <button class="btn" id="ofSend">${ed ? "Сохранить" : "Отправить на проверку"}</button>`);
  document.querySelectorAll("#ofg .chip").forEach(el => el.onclick = () => { game = el.dataset.g; haptic(); document.querySelectorAll("#ofg .chip").forEach(x => x.classList.toggle("on", x === el)); });
  const hint = () => { const v = +$("#ofP").value.replace(/\D/g, ""); $("#ofH").textContent = v ? `Ты получишь ${Math.floor(v * (100 - S.fee) / 100)} ⭐ (комиссия ${S.fee}%)` : `Комиссия магазина ${S.fee}%`; };
  $("#ofP").oninput = hint; hint();
  $("#ofF").onchange = async () => { const f = $("#ofF").files[0]; if (!f) return; try { photo = await resizeImg(f); $("#ofFh").textContent = "✓ Фото готово"; } catch (e) { toast(e.message); } };
  $("#ofSend").onclick = async () => {
    const stars = +$("#ofP").value.replace(/\D/g, ""); $("#ofSend").disabled = true;
    try {
      let r, id = ed && ed.id;
      if (ed) r = await api("/api/seller/offer_edit", { id: ed.id, title: $("#ofT").value.trim(), desc: $("#ofD").value.trim(), stars });
      else { r = await api("/api/seller/offer", { game, title: $("#ofT").value.trim(), desc: $("#ofD").value.trim(), stars }); id = r.id; }
      if (!r.ok) { toast(r.msg || "Ошибка"); $("#ofSend").disabled = false; return; }
      if (photo && id) { const p = await api("/api/seller/offer_img", { id, data: photo }); if (!p.ok) toast(p.msg || "Фото не загрузилось"); }
      closeSheet(); toast(ed ? "Сохранено" : "Отправлено на проверку", true); showOffers();
    } catch (e) { toast(e.message || "Нет связи"); $("#ofSend").disabled = false; }
  };
}
function adSheet(id) {
  const P = [[1, 1], [3, 3], [7, 7]];
  sheetOpen(`<div class="sh-h"><div><h3>Реклама товара</h3><p>Товар поднимается вверх списка с меткой «Реклама». Стоимость списывается с баланса: ${S.adPrice} ⭐ в сутки.</p></div></div>
    <div class="two">${P.map(([d]) => `<button class="btn ghost" data-d="${d}">${d} ${plural(d, "день", "дня", "дней")}<br><small>${d * S.adPrice} ⭐</small></button>`).join("")}</div>
    <div class="hint">Баланс: ${S.me.balance} ⭐</div>`);
  document.querySelectorAll("[data-d]").forEach(b => b.onclick = async () => {
    try { const x = await api("/api/seller/ad", { id, days: +b.dataset.d }); toast(x.msg || (x.ok ? "Реклама включена" : "Ошибка"), x.ok); if (x.ok) { closeSheet(); showOffers(); } } catch (e) { toast("Нет связи"); }
  });
}

/* ---------- Промокоды ---------- */
async function showPromos() {
  view('<div class="sk"></div>');
  try {
    const r = await api("/api/seller/promos", {}); if (!r.ok) throw 0; S.promoMax = r.max_pct;
    view(`<div class="sect"><h3>Мои промокоды</h3><span>${r.promos.length}</span></div>
      <div class="note" style="margin:0 0 12px">Промокод действует только на твои товары. Скидка до ${r.max_pct}% — она за твой счёт. Кэшбэк при промокоде не начисляется.</div>
      <button class="btn" id="np" style="margin-top:0">➕ Создать промокод</button><div style="height:14px"></div>`
      + (r.promos.length ? r.promos.map(p => `<div class="card"><div class="of"><div class="tx" style="font-size:17px">${esc(p.code)}<small>−${p.pct}% · использован ${p.used}${p.max ? " из " + p.max : ""}${p.until ? " · до " + esc(p.until) : ""}</small></div>
        <button class="btn sm bad" data-d="${esc(p.code)}" style="margin:0">✕</button></div></div>`).join("") : '<div class="empty">Промокодов пока нет</div>'));
    $("#np").onclick = promoForm;
    document.querySelectorAll("[data-d]").forEach(b => b.onclick = async () => { if (!confirm("Удалить промокод?")) return; await api("/api/seller/promo_del", { code: b.dataset.d }); showPromos(); });
  } catch (e) { view(`<div class="err">Нет связи<br><button class="btn ghost" onclick="showPromos()">Повторить</button></div>`); }

function promoForm() {
  sheetOpen(`<div class="sh-h"><div><h3>Новый промокод</h3><p>Только на твои товары</p></div></div>
    <div class="row"><label>КОД</label><input class="f" id="pcC" maxlength="20" placeholder="MYSALE10" style="text-transform:uppercase"></div>
    <div class="row"><label>СКИДКА, % (ДО ${S.promoMax})</label><input class="f" id="pcP" inputmode="numeric" placeholder="10"></div>
    <div class="row"><label>ЛИМИТ ИСПОЛЬЗОВАНИЙ (0 — без лимита)</label><input class="f" id="pcM" inputmode="numeric" value="0"></div>
    <div class="row"><label>СРОК, ДНЕЙ (0 — бессрочно)</label><input class="f" id="pcD" inputmode="numeric" value="0"></div>
    <button class="btn" id="pcS">Создать</button>`);
  $("#pcS").onclick = async () => {
    try { const x = await api("/api/seller/promo_new", { code: $("#pcC").value.trim(), pct: +$("#pcP").value, max: +$("#pcM").value || 0, days: +$("#pcD").value || 0 });
      if (!x.ok) { toast(x.msg || "Ошибка"); return; } closeSheet(); toast("Промокод создан", true); showPromos(); } catch (e) { toast("Нет связи"); }
  };
}

/* ---------- Чаты ---------- */
async function showChats() {
  view('<div class="sk"></div>');
  try {
    const r = await api("/api/chat/orders", {}); const list = (r.chats || []).filter(c => c.role === "seller");
    S.me && (S.me.unread = list.reduce((a, c) => a + c.unread, 0)); drawTabs();
    view(`<div class="sect"><h3>Чаты с покупателями</h3><span>${list.length}</span></div><div class="card">`
      + (list.length ? list.map(c => `<div class="cli" data-o="${c.order}" data-l="${esc(c.label)}"><div class="tx">${esc(c.peer)} · #${c.order}<small>${esc(c.last || c.label)}</small></div>${c.unread ? `<i>${c.unread}</i>` : ""}</div>`).join("")
        : '<div class="empty">Чаты появятся после первых оплаченных заказов</div>') + `</div><div class="note">Общение только здесь и в боте. Ссылки, @username и телефоны блокируются.</div>`);
    document.querySelectorAll(".cli").forEach(el => el.onclick = () => openChat(+el.dataset.o, "Покупатель", el.dataset.l));
  } catch (e) { view('<div class="err">Нет связи</div>'); }
}
async function openChat(order, peer, label) {
  sheetOpen(`<div class="sh-h"><div><h3 id="chT">${esc(peer)}</h3><p>${esc(label || "")} · #${order}</p></div></div>
    <div class="chat" id="chBox"><div class="sk" style="height:60px"></div></div>
    <div class="cin"><input class="f" id="chIn" maxlength="500" placeholder="Сообщение…" autocomplete="off"><button id="chSend" aria-label="Отправить">➤</button></div>`);
  let last = "";
  const load = async () => { try {
    const r = await api("/api/chat/messages", { order }); if (!r.ok || !$("#chBox")) return;
    if (r.peer) $("#chT").textContent = r.peer;
    const sig = r.messages.length + ":" + (r.messages.length ? r.messages[r.messages.length - 1].id : 0); if (sig === last) return; last = sig;
    const box = $("#chBox"), end = box.scrollHeight - box.scrollTop - box.clientHeight < 60 || !box.dataset.ok;
    box.innerHTML = r.messages.length ? r.messages.map(m => `<div class="msg ${m.mine ? "me" : "he"}">${esc(m.text)}<small>${esc(m.time)}</small></div>`).join("") : '<div class="empty" style="padding:30px 10px">Сообщений пока нет</div>';
    box.dataset.ok = 1; if (end) box.scrollTop = box.scrollHeight; } catch (e) {} };
  await load(); S.chatT = setInterval(load, 5000);
  const send = async () => { const t = $("#chIn").value.trim(); if (!t) return; $("#chIn").value = "";
    try { const r = await api("/api/chat/send", { order, text: t }); if (!r.ok) { toast(r.msg || "Не отправилось"); $("#chIn").value = t; } else { haptic(); last = ""; load(); } } catch (e) { toast("Нет связи"); $("#chIn").value = t; } };
  $("#chSend").onclick = send; $("#chIn").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
}

/* ---------- Баланс ---------- */
async function showMoney() {
  view('<div class="sk"></div>');
  let me; try { me = await api("/api/seller/me", {}); if (!me.ok) throw 0; S.me = me; } catch (e) { view('<div class="err">Нет связи</div>'); return; }
  view(`<div class="card"><h4>Баланс</h4><div class="kv"><div class="g"><b>${me.balance}</b><span>доступно ⭐</span></div><div class="w"><b>${me.escrow || 0}</b><span>в сделках ⭐</span></div><div><b>${me.earned}</b><span>заработано ⭐</span></div></div>
    <p>«В сделках» — деньги покупателей, которые держит магазин до подтверждения получения.${me.pending_payout ? `<br>На выводе: <b>${me.pending_payout} ⭐</b> (ждёт админа)` : ""}</p>
    <button class="btn" id="po">💸 Вывести</button></div>
    <div class="card"><h4>Мой профиль</h4><div class="kv"><div><b>${me.deals}</b><span>сделок</span></div><div><b>${me.reviews ? "★ " + me.avg : "—"}</b><span>рейтинг</span></div><div><b>${me.reviews}</b><span>отзывов</span></div></div>
      ${me.verified ? '<p><span class="ck">✓</span> Ты проверенный продавец — галочка видна покупателям.</p>' : '<p>Галочку ✓ админ выдаёт продавцам с хорошим рейтингом и количеством выполненных сделок.</p>'}
      <button class="btn ghost" id="rv">⭐ Мои отзывы</button></div>
    <div class="note">Комиссия магазина ${me.fee}%. Минимальный вывод ${me.payout_min} ⭐. Выплата вручную через администратора.</div>`);
  $("#po").onclick = () => payoutForm(me);
  $("#rv").onclick = openReviews;
}
function payoutForm(me) {
  sheetOpen(`<div class="sh-h"><div><h3>Вывод средств</h3><p>Доступно ${me.balance} ⭐ · минимум ${me.payout_min} ⭐</p></div></div>
    <div class="row"><label>СУММА, ⭐</label><input class="f" id="poS" inputmode="numeric" value="${me.balance >= me.payout_min ? me.balance : ""}"></div>
    <div class="row"><label>КУДА ВЫПЛАТИТЬ</label><textarea class="f" id="poD" maxlength="200" placeholder="Карта, кошелёк или @username"></textarea></div>
    <button class="btn" id="poSend">Запросить вывод</button>`);
  $("#poSend").onclick = async () => {
    try { const r = await api("/api/seller/payout", { stars: +$("#poS").value.replace(/\D/g, ""), details: $("#poD").value.trim() });
      if (!r.ok) { toast(r.msg || "Ошибка"); return; } closeSheet(); toast("Запрос отправлен админу", true); showMoney(); } catch (e) { toast("Нет связи"); }
  };
}
async function openReviews() {
  sheetOpen('<div class="sk" style="height:120px"></div>');
  try {
    const r = await api("/api/reviews?seller=" + S.me.id);
    $("#sheet").innerHTML = `<div class="grab"></div><button class="sx" id="sx">✕</button><div class="sh-h"><div><h3>Мои отзывы</h3><p>${r.count ? `★ ${r.avg} · ${r.count} ${plural(r.count, "отзыв", "отзыва", "отзывов")}` : "Пока нет отзывов"}</p></div></div>`
      + (r.reviews.length ? r.reviews.map(v => `<div class="rvi"><div class="t"><b>${esc(v.name)}</b><span>${"★".repeat(v.rating)}${"☆".repeat(5 - v.rating)}</span></div>${v.text ? `<p>${esc(v.text)}</p>` : ""}<small>${esc(v.label)} · ${esc(v.date)}</small></div>`).join("") : '<div class="empty">Отзывы появятся после выполненных заказов</div>');
    $("#sx").onclick = closeSheet;
  } catch (e) { $("#sheet").innerHTML = '<div class="err">Нет связи</div>'; }
}
boot();
</script>
