<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Azika Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0d0820; --card:rgba(255,255,255,.07); --card2:rgba(255,255,255,.11); --solid:#1a1241; --line:rgba(255,255,255,.1);
  --text:#f5f2ff; --muted:#a99fd6; --v1:#8b5cf6; --v2:#c026d3; --mint:#2ee6a6; --pink:#ff4fa3; --gold:#ffc83d; --bad:#ff5d73;
  --shadow:0 14px 34px rgba(0,0,0,.38); --tabbg:rgba(22,14,54,.86); --grad:linear-gradient(135deg,#8b5cf6 0%,#c026d3 100%);
  --glow1:rgba(139,92,246,.5); --glow2:rgba(255,79,163,.26); --glow3:rgba(46,230,166,.16); --onmint:#06261b;
}
:root[data-theme=light]{
  --bg:#f6f3ff; --card:#ffffff; --card2:#f1ecff; --solid:#ffffff; --line:#e6defa; --text:#1c1540; --muted:#7a6fa8;
  --shadow:0 12px 28px rgba(109,40,217,.13); --tabbg:rgba(255,255,255,.92);
  --glow1:rgba(139,92,246,.3); --glow2:rgba(255,79,163,.16); --glow3:rgba(46,230,166,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.cmseg{display:flex;gap:6px;margin:0 0 10px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.cmseg button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:800;font-size:13px;padding:9px 6px;border-radius:11px;cursor:pointer}
.cmseg button.on{background:var(--grad);color:#fff}
.fcode{display:flex;align-items:center;gap:8px;margin-top:8px}.fcode b{font-family:Unbounded,sans-serif;letter-spacing:.06em;font-size:16px;flex:1;user-select:all}
html,body{margin:0;color:var(--text);font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg)}
body{min-height:100vh;overflow-x:hidden;padding:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)) 0 calc(96px + env(safe-area-inset-bottom));
  background:radial-gradient(900px 520px at 8% -8%,var(--glow1),transparent 62%),radial-gradient(700px 520px at 105% 6%,var(--glow2),transparent 62%),radial-gradient(640px 520px at 50% 112%,var(--glow3),transparent 62%),var(--bg);
  background-attachment:fixed;transition:background-color .3s,color .3s}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.disp{font-family:Unbounded,Manrope,sans-serif}

/* --- шапка --- */
.top{display:flex;align-items:center;gap:10px;padding:14px 0 10px}
.logo{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo i{flex:none;width:38px;height:38px;border-radius:13px;background:var(--grad);display:grid;place-items:center;box-shadow:0 8px 20px rgba(192,38,211,.45)}
.logo i svg{width:21px;height:21px;fill:#fff}
.logo span{font-family:Unbounded,Manrope,sans-serif;font-weight:800;font-size:17px;letter-spacing:.2px;white-space:nowrap}
.logo b{background:linear-gradient(90deg,#c4b5fd,var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent}
.bal{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap}
.bal svg{width:14px;height:14px;fill:var(--gold)}
.iconbtn{flex:none;width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--text);display:grid;place-items:center;cursor:pointer;transition:transform .2s}
.iconbtn:active{transform:scale(.9) rotate(18deg)}
.iconbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* --- анимации входа --- */
.view{animation:viewIn .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.up{animation:up .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*50ms)}
@keyframes up{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-6px) rotate(-3deg)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* --- поиск и чипы --- */
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 14px;margin-bottom:12px;transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:var(--v1);box-shadow:0 0 0 4px rgba(139,92,246,.2)}
.search svg{width:19px;height:19px;flex:none;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:600 15px Manrope,sans-serif;padding:14px 0}
.search input::placeholder{color:var(--muted);font-weight:500}
.fbar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:12px;font-weight:800;font-size:14px;cursor:pointer;transition:transform .15s}
.fbar:active{transform:scale(.98)}.fbar b{color:var(--mint);margin-left:6px}
.fbar svg{width:22px;height:22px;fill:none;stroke:var(--text);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fl{font:800 12px Manrope,sans-serif;color:var(--muted);letter-spacing:.04em;margin:14px 0 8px}
.fchips{display:flex;flex-wrap:wrap;gap:8px}
.pr2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fbtns{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:18px}
.cbn{font-size:13px;font-weight:700;color:var(--mint);padding:3px 0}.cbn.no{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 15px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;transition:all .2s}
.chip.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 18px rgba(192,38,211,.4)}

/* --- баннеры --- */
.banners{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px 6px;padding:0 16px 4px;scrollbar-width:none}
.banners::-webkit-scrollbar{display:none}
.bn{position:relative;flex:none;width:86%;scroll-snap-align:center;border-radius:24px;padding:18px;color:#fff;overflow:hidden;cursor:pointer;min-height:138px;box-shadow:var(--shadow)}
.bn h4{margin:0 0 6px;font:800 17px/1.2 Unbounded,Manrope,sans-serif;position:relative;max-width:78%}
.bn p{margin:0 0 12px;font-size:13px;line-height:1.4;opacity:.92;position:relative;max-width:76%}
.bn .go{position:relative;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:12px;background:rgba(255,255,255,.22);backdrop-filter:blur(6px);font-weight:800;font-size:13px}
.bn .deco{position:absolute;right:-10px;bottom:-14px;width:130px;height:130px;opacity:.95;animation:float 4s ease-in-out infinite}
.bn.b1{background:linear-gradient(120deg,#6d28d9,#c026d3 60%,#ff4fa3)}
.bn.b2{background:linear-gradient(120deg,#0ea5a4,#2ee6a6 70%,#9af0cf);color:#04261c}
.bn.b3{background:linear-gradient(120deg,#4338ca,#8b5cf6 65%,#38bdf8)}
.dots{display:flex;justify-content:center;gap:6px;margin:8px 0 14px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:all .3s}
.dots i.on{width:18px;border-radius:4px;background:var(--v1)}

/* --- секции --- */
.sect{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 12px}
.sect h3{margin:0;font:800 16px Unbounded,Manrope,sans-serif}
.sect span{font-size:12px;color:var(--muted);font-weight:600}
.hrow{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none;scroll-snap-type:x proximity}
.hrow::-webkit-scrollbar{display:none}
.hot{flex:none;width:136px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px;cursor:pointer;transition:transform .18s;box-shadow:var(--shadow)}
.hot:active{transform:scale(.95)}
.hot .im{height:92px;border-radius:14px;display:grid;place-items:center;position:relative;overflow:hidden}
.hot .im svg.pi{width:70px;height:70px;animation:float 3.6s ease-in-out infinite;position:relative}
.hot .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hot .gn{font-size:11px;color:var(--muted);font-weight:700;margin-top:8px}
.hot .lb{font-weight:800;font-size:13px;margin:2px 0 7px;line-height:1.25;min-height:32px}

/* --- карточки игр --- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.game{position:relative;border-radius:22px;overflow:hidden;cursor:pointer;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .2s}
.game:active{transform:scale(.96)}
.art{position:relative;overflow:hidden;display:grid;place-items:center}
.art:before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;right:-40px;top:-50px;background:radial-gradient(circle,rgba(255,255,255,.35),transparent 65%)}
.art:after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;left:-34px;bottom:-44px;background:radial-gradient(circle,rgba(0,0,0,.3),transparent 70%)}
.art .gl{position:relative;z-index:1;width:54px;height:54px;fill:#fff;filter:drop-shadow(0 6px 12px rgba(0,0,0,.35));animation:float 3.4s ease-in-out infinite}
.art .sp{position:absolute;z-index:1;border-radius:50%;background:rgba(255,255,255,.55);animation:tw 2.6s ease-in-out infinite}
@keyframes tw{50%{opacity:.15;transform:scale(.5)}}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.game .art{height:118px}
.game .meta{padding:11px 12px 13px}
.game .nm{font-weight:800;font-size:14px}
.game .ct{color:var(--muted);font-size:12px;font-weight:600;margin-top:3px;display:flex;align-items:center;gap:5px}
.game .ct b{color:var(--mint);font-weight:800}
.game .tag{position:absolute;left:10px;top:10px;z-index:3;padding:4px 9px;border-radius:99px;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);color:#fff;font-size:11px;font-weight:800}

/* --- страница игры --- */
.cover{position:relative;height:150px;border-radius:24px;overflow:hidden;margin:2px 0 14px;box-shadow:var(--shadow)}
.cover .art{position:absolute;inset:0}
.cover .art .gl{width:74px;height:74px}
.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(10,6,28,.78),transparent 60%);z-index:3}
.cover .tx{position:absolute;left:16px;right:16px;bottom:14px;z-index:4;color:#fff}
.cover h2{margin:0 0 3px;font:800 21px Unbounded,Manrope,sans-serif}
.cover p{margin:0;font-size:12px;font-weight:600;opacity:.9}
.sort{display:flex;gap:8px;margin-bottom:12px}
.pbar{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px 12px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow);transition:transform .18s,border-color .18s}
.pbar:active{transform:scale(.975)}
.pbar .im{flex:none;width:64px;height:64px;border-radius:16px;display:grid;place-items:center;position:relative;overflow:hidden}
.pbar .im svg.pi{width:56px;height:56px;animation:float 3.6s ease-in-out infinite;animation-delay:calc(var(--i,0)*-.4s)}
.pbar .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pbar .mid{flex:1;min-width:0}
.pbar .lb{font-weight:800;font-size:15px}
.pbar .sb{font-size:12px;color:var(--muted);font-weight:600;margin-top:3px;display:flex;align-items:center;gap:5px}
.pbar .sb:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint)}
.price{flex:none;display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:14px;color:var(--onmint);padding:8px 12px;border-radius:13px;background:linear-gradient(135deg,var(--mint),#9af0cf)}
.price svg{width:13px;height:13px;fill:#b07400}
.hot .price{padding:6px 10px;font-size:13px}

/* --- шторка оплаты --- */
.ov{position:fixed;inset:0;z-index:30;background:rgba(6,3,20,.62);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.ov.show{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--solid);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.9,.2,1)}
.ov.show .sheet{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 14px}
.sh-h{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.sh-h .im{flex:none;width:68px;height:68px;border-radius:18px;display:grid;place-items:center;position:relative;overflow:hidden}
.sh-h .im svg.pi{width:60px;height:60px}
.sh-h .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sh-h h3{margin:0;font:800 17px Unbounded,Manrope,sans-serif}.sh-h p{margin:4px 0 0;color:var(--muted);font-size:13px;font-weight:600}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 7px;letter-spacing:.2px}
input.f,textarea.f{width:100%;background:var(--card);border:1.5px solid var(--line);color:var(--text);border-radius:14px;padding:13px 14px;font:600 16px Manrope,sans-serif;outline:none;transition:border-color .2s,box-shadow .2s}
input.f:focus,textarea.f:focus{border-color:var(--v1);box-shadow:0 0 0 4px rgba(139,92,246,.2)}
textarea.f{resize:none;height:58px}
.row{margin-bottom:14px}
.hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4;font-weight:500}
.promo{display:flex;gap:8px}
.promo input{text-transform:uppercase}
.mini{flex:none;border:0;border-radius:14px;padding:0 16px;font:800 14px Manrope,sans-serif;color:#fff;background:var(--grad);cursor:pointer;transition:transform .15s}
.mini:active{transform:scale(.94)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:rgba(46,230,166,.14);color:var(--mint);font-weight:800;font-size:13px;border:1px solid rgba(46,230,166,.35)}
.pill u{text-decoration:none;opacity:.8;cursor:pointer;font-size:15px}
.pm{font-size:13px;margin-top:7px;font-weight:700}.pm.ok{color:var(--mint)}.pm.bad{color:var(--bad)}
.tg{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:14px;font-size:14px;font-weight:700}
.tg small{display:block;color:var(--muted);font-weight:600;font-size:12px;margin-top:2px}
.sw{position:relative;width:48px;height:28px;border-radius:99px;background:var(--line);transition:background .25s;flex:none;cursor:pointer}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.sw.on{background:var(--mint)}.sw.on:after{transform:translateX(20px)}
.sum{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:14px;font-weight:600}
.sum div{display:flex;justify-content:space-between;padding:3px 0;color:var(--muted)}
.sum div.ds{color:var(--mint);font-weight:800}
.sum div.tot{color:var(--text);font-weight:800;font-size:17px;border-top:1px dashed var(--line);margin-top:6px;padding-top:10px}
.sum div.tot b{color:var(--gold)}
.btn{position:relative;overflow:hidden;width:100%;border:0;border-radius:16px;padding:16px;font:800 16px Manrope,sans-serif;color:#fff;background:var(--grad);cursor:pointer;box-shadow:0 12px 26px rgba(192,38,211,.42);transition:transform .15s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.6}
.btn:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{60%,100%{left:130%}}
.btn.ghost{background:var(--card);border:1px solid var(--line);box-shadow:none;color:var(--text)}
.btn.ghost:after{display:none}
.spn{display:inline-block;width:16px;height:16px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px;margin-right:8px}

/* --- заказы --- */
.order{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:11px;box-shadow:var(--shadow)}
.order .h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;font-size:14px}
.order .m{color:var(--muted);font-size:12px;margin-top:7px;line-height:1.55;font-weight:600}
.badge{font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--card2);color:var(--muted);white-space:nowrap}
.badge.paid{background:rgba(255,200,61,.16);color:var(--gold)}.badge.done{background:rgba(46,230,166,.16);color:var(--mint)}
.pausebn{margin:0 0 12px;padding:12px 14px;border-radius:14px;background:rgba(255,184,77,.16);border:1px solid rgba(255,184,77,.4);color:#ffcf87;font-weight:700;font-size:13px}
.lvl.pulse{animation:lvlp 1.6s ease-out infinite}
@keyframes lvlp{0%{box-shadow:0 0 0 0 rgba(139,92,246,.7)}70%{box-shadow:0 0 0 10px rgba(139,92,246,0)}100%{box-shadow:0 0 0 0 rgba(139,92,246,0)}}
.lvrow{display:flex;align-items:center;flex-wrap:nowrap;min-width:0}.lvrow .lvl{min-width:0;flex:0 1 auto;white-space:nowrap;overflow:hidden}.lvrow .lvl small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me>div{min-width:0}
.tapme{flex:none;white-space:nowrap;margin-left:8px;font-size:12px;font-weight:800;color:var(--muted);animation:nudge 1.2s ease-in-out infinite;display:inline-block}
@keyframes nudge{50%{transform:translateX(-4px)}}
.lvl small{font-weight:700;opacity:.75;font-size:11px}.lvl:active{transform:scale(.96)}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--card2);margin-bottom:8px;opacity:.65}.lrow.on{opacity:1}.lrow.cur{outline:2px solid var(--mint)}
.lrow .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:13px}.lrow.on .n{background:var(--mint);color:var(--onmint)}
.lrow b{display:block;font-size:14px}.lrow small{display:block;color:var(--muted);font-size:12px;font-weight:600}.lrow em{margin-left:auto;font-style:normal;font-size:11px;font-weight:800;color:var(--mint)}
.req{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px}.req i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;color:var(--muted)}.req b{margin-left:auto;color:var(--mint);font-size:12px;white-space:nowrap}
.bar{height:9px;border-radius:5px;background:var(--card2);overflow:hidden;margin:10px 0 8px}.bar i{display:block;height:100%;border-radius:5px;background:var(--grad);transition:width .8s cubic-bezier(.2,.9,.2,1)}
.lvs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.lvs span{text-align:center;background:var(--card2);border-radius:12px;padding:8px 4px;font-size:12px;font-weight:800;color:var(--muted)}.lvs span small{display:block;font-size:10px;font-weight:700;opacity:.8}.lvs span.on{background:rgba(46,230,166,.16);color:var(--mint)}
.badge.delivered{background:rgba(139,92,246,.2);color:#c4b5fd}.badge.dispute{background:rgba(255,93,115,.16);color:var(--bad)}
.badge.refunded{background:rgba(255,93,115,.16);color:var(--bad)}
.steps{display:flex;align-items:center;margin-top:12px}
.steps i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;color:var(--muted)}
.steps i.on{background:var(--grad);color:#fff}
.steps i.ok{background:var(--mint);color:var(--onmint)}

<body>
<svg width="0" height="0" style="position:absolute"><defs id="defs"></defs></svg>
<canvas id="confetti"></canvas>
<div class="wrap">
  <div class="top">
    <div class="logo"><i><svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.8-6.3 3.8 1.7-7L2 9.2l7.1-.6z"/></svg></i><span><b>Azika</b> Shop</span></div>
    <div class="bal" id="bal" style="display:none"></div>
    <button class="iconbtn" id="themeBtn" aria-label="Тема"></button>
  </div>
  <div id="app"></div>
</div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div class="tabs" id="tabs">
  <div class="ind" id="ind"></div>
  <div class="tab on" data-t="shop"><svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>Магазин</div>
  <div class="tab" data-t="chats"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/></svg>Чаты<i class="tb" id="tbChats" style="display:none"></i></div>
  <div class="tab" data-t="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>Профиль</div>
  <div class="tab" data-t="help"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 114 2c-.9.6-1.6 1.1-1.6 2.2M12 17h.01"/></svg>Помощь</div>
</div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand();
  try { if (tg.requestFullscreen && !tg.isFullscreen && /^(android|android_x|ios)$/.test(tg.platform || "")) tg.requestFullscreen(); } catch (e) {}
  try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
  const hb = () => { if (!document.hidden && tg.initData) api("/api/beat", {}).catch(() => {}); };
  setTimeout(hb, 1500); setInterval(hb, 30000); }

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
const params = new URLSearchParams(location.search);
let API = (params.get("api") || store("api") || "").replace(/\/$/, "");
if (params.get("api")) store("api", API);

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const haptic = (t = "light") => { try { tg.HapticFeedback.impactOccurred(t); } catch (e) {} };
const GROUPS = { all: "Все", supercell: "Supercell", shooter: "Шутеры", gift: "🎁 Карты" };
let state = { qg: null, qp: null, qv: null, ids: {}, tab: "shop", games: [], support: "@azikashop_support_bot", refPct: 5, done: 0, game: null, pack: null,
  promo: null, promoMsg: null, useBonus: true, q: null, search: "", group: "all", sort: "pop", balance: 0, f: { games: [], min: "", max: "", sort: "pop", cb: false }, cbPct: 5, cbMin: 100, starRub: 1.59, ttl: 30, fee: 5, payoutMin: 100, feeMin: 4, shopRt: { avg: 0, count: 0 }, seller: null };
try { const sp = JSON.parse(store("promo") || "null"); if (sp && sp.code) state.promo = sp; } catch (e) {}

/* ---------- Тема ---------- */
const SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>';
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  $("#themeBtn").innerHTML = t === "dark" ? SUN : MOON;
  const c = t === "dark" ? "#0d0820" : "#f6f3ff";
  try { tg.setHeaderColor(c); tg.setBackgroundColor(c); } catch (e) {}
}
applyTheme(store("theme") || "dark");
$("#themeBtn").onclick = () => { const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; store("theme", t); applyTheme(t); haptic(); };

function toast(msg, ok) {
  const t = $("#toast"); t.textContent = msg; t.className = "toast show" + (ok ? " ok" : "");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 3400);
}
async function api(path, body) {
  if (!API) throw new Error("Адрес сервера не задан. Открой магазин из бота.");
  const opt = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ...body, initData: tg ? tg.initData : "" }) };
  const r = await fetch(API + path, opt);
  return r.json();
}

/* ---------- Иконки и арт (всё SVG, оригинальные) ---------- */
const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (h, t, a) => "#" + hex2rgb(h).map(v => Math.round(v + (t - v) * a).toString(16).padStart(2, "0")).join("");
const seen = {};
function grad(c) {
  const id = "g" + c.slice(1);
  if (!seen[id]) {
    seen[id] = 1;
    $("#defs").insertAdjacentHTML("beforeend", `<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${mix(c, 255, .5)}"/><stop offset=".5" stop-color="${c}"/><stop offset="1" stop-color="${mix(c, 0, .28)}"/></linearGradient>`);
  }
  return `url(#${id})`;
}
function shape(icon, c) {
  const f = grad(c);
  switch (icon) {
    case "card": return `<rect x="4" y="12" width="56" height="40" rx="7" fill="${f}"/><rect x="4" y="12" width="56" height="16" rx="7" fill="#fff" opacity=".28"/><rect x="11" y="38" width="22" height="5" rx="2.5" fill="#fff" opacity=".8"/><rect x="11" y="46" width="14" height="3" rx="1.5" fill="#fff" opacity=".5"/><circle cx="48" cy="40" r="7" fill="#fff" opacity=".85"/><path d="M45 40l2.2 2.4L51.5 37" fill="none" stroke="#0b0b0b" stroke-opacity=".7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
    case "diamond": return `<polygon points="32,3 58,26 32,61 6,26" fill="${f}"/><polygon points="32,3 58,26 32,32 6,26" fill="#fff" opacity=".38"/><polygon points="32,32 58,26 32,61" fill="#000" opacity=".14"/><path d="M15 25L25 12" stroke="#fff" stroke-opacity=".75" stroke-width="3" stroke-linecap="round"/>`;
    case "coin": return `<circle cx="32" cy="32" r="26" fill="${f}"/><circle cx="32" cy="32" r="20" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3"/><polygon points="32,17 36,27.5 47,28 38.5,35 41.5,46 32,39.5 22.5,46 25.5,35 17,28 28,27.5" fill="#fff" opacity=".9"/>`;
    case "uc": return `<circle cx="32" cy="32" r="26" fill="${f}"/><circle cx="32" cy="32" r="20" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3"/><text x="32" y="39" text-anchor="middle" font-size="20" font-weight="800" fill="#fff" font-family="Arial,sans-serif">UC</text>`;
    case "pass": return `<path d="M8 16h48a4 4 0 014 4v7a5 5 0 000 10v7a4 4 0 01-4 4H8a4 4 0 01-4-4v-7a5 5 0 000-10v-7a4 4 0 014-4z" fill="${f}"/><path d="M16 24v16" stroke="#fff" stroke-opacity=".5" stroke-width="2.5" stroke-dasharray="3 4"/><polygon points="38,22 41,30 49.5,30.5 43,36 45,44 38,39.5 31,44 33,36 26.5,30.5 35,30" fill="#fff" opacity=".92"/>`;
    default: return `<polygon points="32,5 56,21 48,57 16,57 8,21" fill="${f}"/><polygon points="32,5 56,21 32,28 8,21" fill="#fff" opacity=".38"/><polygon points="32,28 56,21 48,57" fill="#000" opacity=".13"/><polygon points="32,28 8,21 16,57" fill="#fff" opacity=".12"/><path d="M14 24L24 12" stroke="#fff" stroke-opacity=".75" stroke-width="3" stroke-linecap="round"/>`;
  }
}
const LAYOUT = {
  1: [[32, 33, 1]], 2: [[24, 38, .78], [41, 32, .92]],
  3: [[32, 25, .66], [19, 42, .64], [45, 42, .64]], 4: [[32, 20, .58], [17, 36, .6], [47, 36, .6], [32, 45, .72]]
};
function packSvg(icon, c, tier) {
  const items = icon === "pass" ? [[32, 33, 1.05]] : LAYOUT[Math.min(4, Math.max(1, tier))];
  const g = items.map(([x, y, s]) => `<g transform="translate(${(x - 32 * s).toFixed(1)} ${(y - 32 * s).toFixed(1)}) scale(${s})">${shape(icon, c)}</g>`).join("");
  return `<svg class="pi" viewBox="0 0 64 64" style="filter:drop-shadow(0 6px 8px ${mix(c, 0, .2)}66)">${g}</svg>`;
}
const GLYPH = {
  bs: '<path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.8-6.3 3.8 1.7-7L2 9.2l7.1-.6z"/>',
  cr: '<path d="M3 7l4.5 4L12 4l4.5 7L21 7l-1.6 11H4.6zM5 20h14v2H5z"/>',
  coc: '<path d="M4 21V9h3v3h2V9h2v3h2V9h2v3h2V9h3v12h-6v-5a3 3 0 00-6 0v5z"/>',
  pubg: '<path d="M11 2h2v3.1A7 7 0 0118.9 11H22v2h-3.1A7 7 0 0113 18.9V22h-2v-3.1A7 7 0 015.1 13H2v-2h3.1A7 7 0 0111 5.1zm1 5a5 5 0 100 10 5 5 0 000-10zm0 3a2 2 0 110 4 2 2 0 010-4z"/>',
  ff: '<path d="M12.5 2c.6 3.7 4.5 5.5 4.5 10.2a5 5 0 01-10 0c0-1.9.9-3.1 1.8-4 .1 1.8 1 2.8 2 2.8-.3-3.1-.3-6 1.7-9z"/>',
  so2: '<path d="M12 2a10 10 0 100 20 10 10 0 000-20zm0 3a7 7 0 110 14 7 7 0 010-14zm0 3a4 4 0 100 8 4 4 0 000-8zm0 2.5a1.5 1.5 0 110 3 1.5 1.5 0 010-3z"/>'
};
const GROUP_OF = { bs: "supercell", cr: "supercell", coc: "supercell", pubg: "shooter", ff: "shooter", so2: "shooter", gc_apple: "gift", gc_gplay: "gift", gc_steam: "gift", gc_psn: "gift", gc_xbox: "gift", gc_roblox: "gift", gc_spotify: "gift" };
const bgOf = c => `linear-gradient(135deg,${mix(c, 255, .22)},${mix(c, 0, .38)})`;
function art(g, h) {
  const sp = [[18, 22, 5], [70, 62, 4], [48, 14, 3], [82, 28, 6]].map(([x, y, s], i) =>
    `<i class="sp" style="left:${x}%;top:${y}%;width:${s}px;height:${s}px;animation-delay:${i * .5}s"></i>`).join("");
  return `<div class="art" style="background:${bgOf(g.color)};${h ? "height:" + h + "px" : ""}">${sp}<svg class="gl" viewBox="0 0 24 24">${GLYPH[g.id] || GLYPH.bs}</svg>${g.img ? `<img src="${esc(API + g.img)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</div>`;
}
const STAR = '<svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.8-6.3 3.8 1.7-7L2 9.2l7.1-.6z"/></svg>';
const ARROW = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
const SEARCH = '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';
const CHEV = '<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';
const ownOf = g => { const o = g.packs.filter(p => !p.offer); return o.length ? o : g.packs; };
const minPrice = g => Math.min(...ownOf(g).map(p => p.stars));
const plural = (n, a, b, c) => { const m = n % 100, k = n % 10; return m > 10 && m < 20 ? c : k === 1 ? a : k >= 2 && k <= 4 ? b : c; };

function packArt(g, p) {   // иконка товара: тёмная подложка цвета игры, кристаллы цвета игры
  return `<div class="im" style="background:linear-gradient(135deg,${mix(g.color, 0, .55)},${mix(g.color, 0, .78)})">${p.img ? `<img src="${esc(API + p.img)}" alt="" loading="lazy" onerror="this.remove()">` : packSvg(p.icon, g.color, p.tier)}</div>`;
}

/* ---------- Главная ---------- */
function view(html) { const a = $("#app"); a.innerHTML = `<div class="view">${state.sub === "orders" ? '<button class="bkp" id="bkp">‹ Профиль</button>' : ""}${html}</div>`;
  if (state.sub === "orders" && $("#bkp")) $("#bkp").onclick = () => { haptic(); state.sub = null; showProfile(); };
  return a; }

function bannerHtml() {
  const hasPromo = state.promo;
  return `<div class="banners" id="bn">
    <div class="bn b1 up" data-a="promo"><h4>${hasPromo ? "Скидка " + state.promo.pct + "% активна" : "Есть промокод?"}</h4><p>${hasPromo ? "Код " + esc(state.promo.code) + " применится к следующему заказу" : "Введи его и получи скидку на любой товар"}</p><span class="go">${hasPromo ? "Изменить" : "Ввести код"} ${ARROW}</span>
      <svg class="deco" viewBox="0 0 64 64">${shape("pass", "#ffd166")}</svg></div>
    <div class="bn b2 up" data-a="ref" style="--i:1"><h4>Баллы за друзей</h4><p>${state.refPct}% баллами с каждого заказа друга. 1 балл = 1 ₽ скидки</p><span class="go">Пригласить ${ARROW}</span>
      <svg class="deco" viewBox="0 0 64 64">${shape("coin", "#ffffff")}</svg></div>
    <div class="bn b3 up" data-a="level" style="--i:2"><h4>Кэшбэк до ${state.cbPct}% баллами</h4><p>Уровни 1% → 3% → 5% растут с покупками. От ${state.cbMin} ⭐ за заказ. С промокодом кэшбэк не начисляется</p><span class="go">Мой уровень ${ARROW}</span>
      <svg class="deco" viewBox="0 0 64 64">${shape("gem", "#a5f3fc")}</svg></div>
  </div><div class="dots" id="dots"><i class="on"></i><i></i><i></i></div>`;
}

function hotList() {
  const out = [];
  state.games.forEach(g => { if (state.group !== "all" && GROUP_OF[g.id] !== state.group) return; const own = g.packs.filter(x => !x.offer), p = own[Math.min(2, own.length - 1)]; if (p) out.push([g, p]); });
  const ads = []; state.games.forEach(g => g.packs.filter(x => x.ad).forEach(p => ads.push([g, p])));
  return ads.slice(0, 3).concat(out);
}

const SORTI = '<svg viewBox="0 0 24 24"><path d="M3 6h13M3 12h9M3 18h5"/><path d="M19 5v14M16 16l3 3 3-3"/></svg>';
function fCount() { const f = state.f; return (f.games.length ? 1 : 0) + (f.min !== "" || f.max !== "" ? 1 : 0) + (f.sort !== "pop" ? 1 : 0) + (f.cb ? 1 : 0); }
function filtered() {
  const f = state.f, q = state.search.trim().toLowerCase(), out = [];
  state.games.forEach(g => {
    if (f.games.length && !f.games.includes(g.id)) return;
    if (!q && state.group !== "all" && GROUP_OF[g.id] !== state.group) return;
    g.packs.forEach(p => {
      if (q && !(g.name + " " + p.label).toLowerCase().includes(q)) return;
      if (f.min !== "" && p.stars < +f.min) return;
      if (f.max !== "" && p.stars > +f.max) return;
      if (f.cb && (p.offer || p.stars < state.cbMin)) return;
      out.push([g, p]);
    });
  });
  if (f.sort === "cheap") out.sort((a, b) => a[1].stars - b[1].stars);
  if (f.sort === "exp") out.sort((a, b) => b[1].stars - a[1].stars);
  return out;
}

function openFilters() {
  const f = state.f;
  sheetOpen(`
    <div class="sh-h"><div><h3>Фильтры</h3><p>Подбери товар по игре, цене и кэшбэку</p></div></div>

function statHb(items, nameK, valK, cntK, unit) {

function qsEdges(w) {
  const r = w.querySelector(":scope > div"), l = w.querySelector(".qa.l"), rt = w.querySelector(".qa.r");
  const upd = () => { l.style.display = r.scrollLeft > 6 ? "" : "none"; rt.style.display = r.scrollLeft + r.clientWidth < r.scrollWidth - 6 ? "" : "none"; };
  r.addEventListener("scroll", upd, { passive: true }); upd();
  w.querySelectorAll(".qa").forEach(b => b.onclick = () => { haptic(); r.scrollBy({ left: +b.dataset.d * r.clientWidth * .7, behavior: "smooth" }); });
  const on = r.querySelector(".on"); if (on && on._first) r.scrollLeft = on.offsetLeft - r.clientWidth / 2 + on.offsetWidth / 2;
}
function renderQuick(focusOn) {
  const old = $("#qs"); if (!old) return;
  const sg = old.querySelector(".qs-g").scrollLeft, sp = old.querySelector(".qs-p").scrollLeft, same = !focusOn || focusOn === "p";
  const t = document.createElement("div"); t.innerHTML = quickHtml(); const n = t.firstElementChild; n.classList.remove("up"); old.replaceWith(n);
  const G = n.querySelector(".qs-g"), P = n.querySelector(".qs-p"); G.scrollLeft = sg; if (same) P.scrollLeft = sp;
  const center = r => { const on = r.querySelector(".on"); if (on) r.scrollTo({ left: on.offsetLeft - r.clientWidth / 2 + on.offsetWidth / 2, behavior: "smooth" }); };
  if (focusOn === "g") center(G); if (focusOn === "p") center(P);
  bindQuick();
}
function bindQuick() {

      else if (state.promoNote) { state.promoNote = null; renderPromoBox(); }
      renderSum();
    } catch (e) { /* без сети остаётся локальный расчёт */ }

  if (!state.pack || !$("#sum")) return;
  const q = state.q, base = state.pack.stars, bal = q ? q.balance : 0;
  const off = !!state.pack.offer || !!state.pack.gift, gift = !!state.pack.gift;
  $("#bonusRow").innerHTML = bal > 0 && !off ? `<div class="tg"><div>Списать баллы<small>Доступно ${bal} баллов (1 балл = 1 ₽)</small></div><div class="sw ${state.useBonus ? "on" : ""}" id="bsw"></div></div>` : "";

  let rows = `<div><span>${esc(state.pack.label)}</span><span>${base} ⭐</span></div>`;

  else if (hasPromo) rows += `<div class="cbn no">Кэшбэк с промокодом не начисляется</div>`;
  else if (pay >= state.cbMin) { const cb = (q && q.cashback != null) ? q.cashback : Math.floor(pay * ((state.cbLevels && state.cbLevels[0] || { pct: 1 }).pct) / 100 * state.starRub); rows += `<div class="cbn">💸 Кэшбэк +${cb} баллов после выполнения</div>`; }

async function pay(useWallet, crypto) {
  if (state.busy || !state.pack || !state.game) return;
  const player = $("#player").value.trim();
  if (!player) { toast("Введи ID игрока"); return; }
  state.busy = true; const btn = $("#payBtn"); btn.disabled = true; btn.innerHTML = '<span class="spn"></span>Создаю счёт…';
  try {
    const r = await api("/api/invoice", { pack: state.pack.id, player, comment: $("#comment").value.trim(),
      promo: state.promo && !state.pack.gift && !(state.q && state.q.promo_scope) ? state.promo.code : "", use_bonus: state.useBonus, use_wallet: !!useWallet, crypto: !!crypto });
    if (!r.ok) { toast(r.msg || "Ошибка"); return; }
    store("pid_" + state.game.kind, player); if (!state.pack.offer && !state.pack.gift) { state.ids = state.ids || {}; state.ids[state.game.id] = player; state.qv = null; }
    if (r.paid) { if (state.promo) { state.promo = null; store("promo", null); } closeSheet(); showSuccess(r.order); return; }
    if (r.manual) { cryptoManual(r); return; }
    if (r.crypto) {   // CryptoBot: открываем счёт и ждём подтверждения оплаты
      if (tg && tg.openTelegramLink) tg.openTelegramLink(r.link); else window.open(r.link, "_blank");
      toast("Оплати счёт в CryptoBot и вернись сюда — заказ подтвердится сам", true);
      const t0 = Date.now(), ord = r.order;
      const tick = async () => {
        if (Date.now() - t0 > r.ttl * 1000 || document.getElementById("sheet") == null) return;
        try { const c = await api("/api/crypto/check", { order: ord }); if (c.paid) { if (state.promo) { state.promo = null; store("promo", null); } closeSheet(); showSuccess(ord); return; } } catch (e) {}
        setTimeout(tick, 4000);
      };
      setTimeout(tick, 4000); return;
    }
    if (!tg || !tg.openInvoice) { location.href = r.link; return; }
    tg.openInvoice(r.link, st => {
      if (st === "paid") { if (state.promo) { state.promo = null; store("promo", null); } closeSheet(); showSuccess(r.order); }
      else if (st === "failed") toast("Оплата не прошла");
    });
  } catch (e) { toast(e.message || "Нет связи с сервером"); }
  finally { state.busy = false; btn.disabled = false; btn.innerHTML = "Оплатить Stars ⭐"; }
}

function fmtLeft(sec) { const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600); return d ? `${d} дн. ${h} ч` : h ? `${h} ч` : "менее часа"; }

const seenHtml = (ts, on) => { if (on) return '<span class="onl">● онлайн</span>'; if (!ts) return ""; const m = Math.max(1, (Date.now() / 1000 - ts) / 60 | 0); return "был(а) " + (m < 60 ? m + " мин" : m < 1440 ? (m / 60 | 0) + " ч" : (m / 1440 | 0) + " дн") + " назад"; };

const MONTHS = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
function dayLabel(ts) { const d = new Date(ts * 1000), n = new Date(), y = new Date(n - 864e5), s = x => x.toDateString();
  return s(d) === s(n) ? "Сегодня" : s(d) === s(y) ? "Вчера" : d.getDate() + " " + MONTHS[d.getMonth()] + (d.getFullYear() !== n.getFullYear() ? " " + d.getFullYear() : ""); }
const hm = ts => new Date(ts * 1000).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });

function chatHtml(r, myName, myPhoto, peerName) {
  const o = r.order, items = [], buyer = o && o.role === "buyer";
  if (o) { items.push({ ts: o.paid_ts, sys: "paid" }); if (o.delivered_ts) items.push({ ts: o.delivered_ts, sys: "deliv" }); if (o.done_ts) items.push({ ts: o.done_ts, sys: "done" }); }
  r.messages.forEach(m => items.push({ ts: m.ts, m }));
  items.sort((a, b) => a.ts - b.ts);
  const SYS = { paid: [buyer ? "Вы оплатили покупку" : "Покупатель оплатил заказ", buyer ? "Подтвердите после того, как получите товар" : "Передайте товар и нажмите «Передал товар» в заказах"],
    deliv: [buyer ? "📦 Продавец передал товар" : "📦 Вы отметили, что передали товар", buyer ? "Проверьте и подтвердите получение" : "Ждём подтверждения покупателя"],
    done: ["✅ Сделка завершена", buyer ? "Продавец получил оплату" : "Оплата зачислена на баланс"] };
  let h = "", day = "";
  items.forEach(it => {
    const dl = dayLabel(it.ts); if (dl !== day) { day = dl; h += `<div class="dsep"><span>${dl}</span></div>`; }
    if (it.sys) { const t = SYS[it.sys]; h += `<div class="sys"><small>${hm(it.ts)}</small><b>${t[0]}</b>${t[1]}</div>` + (it.sys === "paid" ? orderCard(o) : ""); return; }
    const m = it.m;
    h += `<div class="mrow ${m.mine ? "me" : "he"}">${avEl(m.av, m.mine ? myName : peerName, "", m.mine ? myPhoto : "")}<div class="msg ${m.mine ? "me" : "he"}">${esc(m.text)}<small>${hm(m.ts)}${m.mine ? `<span class="tk ${m.read ? "r" : ""}">${m.read ? "✓✓" : "✓"}</span>` : ""}</small></div></div>`;

}

function countUp(el, to) {
  const t0 = performance.now(), d = 700;
  (function f(t) { const k = Math.min(1, (t - t0) / d); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(f); })(t0);
}
const CBN = ["Новичок", "Игрок", "Легенда"];
function cbOf(p) {
  if (p.cb) return p.cb;
  const L = state.cbLevels && state.cbLevels.length ? state.cbLevels : [{ level: 1, from: 0, pct: 1 }, { level: 2, from: 1000, pct: 3 }, { level: 3, from: 3000, pct: 5 }];
  let i = 0; L.forEach((l, k) => { if ((p.spent || 0) >= l.from) i = k; });
  const nx = L[i + 1];
  return { level: i + 1, pct: L[i].pct, spent: p.spent || 0, next_from: nx ? nx.from : 0, next_pct: nx ? nx.pct : 0, levels: L };
}
function levelSheet(p) {
  const c = cbOf(p);
  const pct = c.next_from ? Math.min(100, Math.round(c.spent / c.next_from * 100)) : 100;
  sheetOpen(`<div class="sh-h"><div><h3>⚡ ${CBN[c.level - 1]}</h3><p>Уровень ${c.level} из ${c.levels.length} · кэшбэк ${c.pct}%</p></div></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    ${c.next_from ? `<div class="req"><i>•</i>Потрачено ${c.spent} из ${c.next_from} ⭐<b>ещё ${c.next_from - c.spent} ⭐</b></div>
      <p class="hint" style="margin:6px 0 0">Дойдёшь до уровня «${CBN[c.level]}» — кэшбэк вырастет до <b>${c.next_pct}%</b></p>`
      : `<div class="cbn">🏆 Максимальный уровень — кэшбэк ${c.pct}%</div>`}
    <h4 style="margin:18px 0 8px">Все уровни</h4>
    ${c.levels.map(l => `<div class="lrow ${l.level <= c.level ? "on" : ""} ${l.level === c.level ? "cur" : ""}"><span class="n">${l.level < c.level ? "✓" : l.level}</span><div><b>${CBN[l.level - 1]} · ${l.pct}%</b><small>${l.from ? "от " + l.from + " ⭐ выполненных заказов" : "с первого заказа"}</small></div>${l.level === c.level ? "<em>ты здесь</em>" : ""}</div>`).join("")}
    <div class="note" style="margin:12px 0 0"><b>Как поднять уровень:</b> оформляй заказы и дожидайся их выполнения — считается сумма выполненных заказов в ⭐. Кэшбэк приходит баллами (1 балл = 1 ₽) с заказов от ${state.cbMin} ⭐ и не начисляется, если в заказе использован промокод.</div>`);
}

function cropImg(file, size = 400) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(img.width, img.height), c = document.createElement("canvas"); c.width = c.height = size;
      c.getContext("2d").drawImage(img, (img.width - k) / 2, (img.height - k) / 2, k, k, 0, 0, size, size); URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg", .86)); };
    img.onerror = () => rej(new Error("Не удалось открыть фото")); img.src = u;
  });
}

async function renderSellerCard() {

  state.seller = r;
  const box = document.createElement("div"); box.className = "card up"; box.style.setProperty("--i", 4);
  if (r.status === "none") {
    box.innerHTML = `<h4>💼 Продавайте на Azika Shop</h4><p>Подайте заявку — после одобрения откроется Azika Seller: свои объявления, промокоды, реклама и чаты с покупателями. Комиссия магазина от ${state.feeMin}% до ${state.fee}% — чем выше уровень продавца, тем она ниже, а лимит объявлений больше.</p><button class="btn" id="sbBtn">Подать заявку</button>`;
  } else if (r.status === "pending") {

  } else if (r.status === "banned") {
    return;

    box.innerHTML = `<h4>💼 Вы продавец ${r.verified ? '<span class="ck">✓</span>' : ""}</h4><p>Выставлять объявления, вести заказы и выводить деньги можно в Azika Seller.</p>
      <button class="btn" id="sbot">🚀 Перейти в Azika Seller${r.unread ? ` · 💬 ${r.unread}` : ""}</button>`;
  }
  $("#app .view").appendChild(box);
  if ($("#sbBtn")) $("#sbBtn").onclick = openApply;
  if ($("#sbot")) $("#sbot").onclick = () => { const u = "https://t.me/" + (r.seller_bot || "azika_sellers_bot"); tg && tg.openTelegramLink ? tg.openTelegramLink(u) : window.open(u, "_blank"); };
}

  ["Как защищены мои деньги у продавца?", "Оплата хранится у магазина, пока ты не получишь товар. Три этапа: оплачено → продавец передал → ты подтвердил. Нажми «Всё получил» — деньги уйдут продавцу. Не нажал — через 3 дня подтвердится автоматически. Если что-то не так, нажми «Проблема» — спор решит поддержка."],
  ["Что значит «Реклама» у товара?", "Продавцы могут оплатить рекламу: такой товар встаёт на 1 место в списке игры. Когда другой продавец покупает рекламу позже, он становится первым, а предыдущий сдвигается на 2 место, затем на 3 и так далее."],
  ["Как общаться с продавцом?", "После оплаты во вкладке «Заказы» появится кнопка «Чат с продавцом». Ответы продавца приходят и сюда, и в бота. Ссылки, @username и телефоны в чате запрещены."],
  ["Как стать продавцом?", "Профиль → «Подать заявку». После одобрения появится кнопка «Перейти в Azika Seller» — там объявления, промокоды, реклама, чаты и вывод. Деньги приходят после подтверждения покупателем (или через 3 дня). Галочку ✓ админ выдаёт проверенным продавцам. Комиссия магазина зависит от уровня продавца: от 10% у новичков до 4% у топ-продавцов, а лимит объявлений растёт."],
  ["Безопасно ли это?", "Оплата идёт внутри Telegram через Stars. Пароли от аккаунтов мы не просим. Если для входа понадобится подтверждение, мы напишем тебе в Telegram."]
];
function showHelp() {
  state.game = null; setBack(false);
  const u = state.support.replace(/^@/, "") + "?start=app";
  view(`<div class="sect up"><h3>Помощь</h3></div>
    <div class="card up" style="margin-top:0;--i:1"><h4>💬 Поддержка</h4><p>Вопрос по заказу? Напиши нам и укажи номер заказа — ответим как можно скорее.</p>
    <button class="btn" id="sup">Написать в поддержку</button></div>
    <div class="card up" style="--i:2"><h4>Частые вопросы</h4>${FAQ.map(([q, a]) => `<div class="faq"><button>${esc(q)}${CHEV}</button><div>${esc(a.replace("{MIN}", state.cbMin).replace("{PCT}", state.cbPct))}</div></div>`).join("")}</div>`);
  $("#sup").onclick = () => { const url = "https://t.me/" + u; tg && tg.openTelegramLink ? tg.openTelegramLink(url) : window.open(url, "_blank"); };
  document.querySelectorAll(".faq button").forEach(b => b.onclick = () => { b.parentElement.classList.toggle("open"); haptic(); });
}

/* ---------- Конфетти ---------- */
function confetti() {
  const c = $("#confetti"), x = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const cols = ["#8b5cf6", "#c026d3", "#ff4fa3", "#2ee6a6", "#ffc83d"];
  const ps = Array.from({ length: 110 }, () => ({ x: innerWidth / 2, y: innerHeight * .35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4,
    s: 5 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[Math.random() * cols.length | 0] }));
  let n = 0;
  (function f() {
    x.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .36; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); });
    if (++n < 120) requestAnimationFrame(f); else x.clearRect(0, 0, c.width, c.height);
  })();
}

/* ---------- Навигация ---------- */
function setBack(on) { if (tg && tg.BackButton) tg.BackButton[on ? "show" : "hide"](); }
if (tg && tg.BackButton) tg.BackButton.onClick(() => {
  if ($("#cf")) { fullClose(); return; }
  if ($("#ov").classList.contains("show")) { closeSheet(); return; }
  if (state.game) { state.game = null; if (state.tab === "shop") showHome(); }
});
function moveInd(t) {
  const el = document.querySelector(`.tab[data-t="${t}"]`), ind = $("#ind");
  ind.style.width = el.offsetWidth + "px"; ind.style.transform = `translateX(${el.offsetLeft - 6}px)`;
}
function updBal() {
  const b = $("#bal");
  if (state.balance > 0) { b.style.display = "flex"; b.innerHTML = `${STAR}${state.balance} б.`; } else b.style.display = "none";
}
$("#bal").onclick = () => switchTab("profile");
function switchTab(t) {
  closeSheet(); state.sub = t === "orders" ? "orders" : null; if (t === "orders") t = "profile", state.sub = "orders";
  state.tab = t; state.game = null; haptic();
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x.dataset.t === t));
  moveInd(t); scrollTo({ top: 0 });
  (state.sub === "orders" ? showOrders : { shop: showHome, chats: showChats, profile: showProfile, help: showHelp }[t])();
}
document.querySelectorAll(".tab").forEach(el => el.onclick = () => switchTab(el.dataset.t));
addEventListener("resize", () => moveInd(state.tab));

async function init() {
  setTimeout(refreshChatBadge, 1500);
  moveInd("shop");
  view('<div class="sk" style="height:52px;margin-bottom:14px"></div><div class="sk" style="height:140px;margin-bottom:16px"></div><div class="grid"><div class="sk" style="height:190px"></div><div class="sk" style="height:190px"></div></div>');
  try {
    const r = await api("/api/catalog");
    if (!r.ok) throw new Error("Каталог недоступен");
    state.ttl = r.ttl_min || 30; state.fee = r.seller_fee ?? 10; state.feeMin = r.seller_fee_min ?? 4; state.payoutMin = r.payout_min || 100; state.shopRt = r.shop_rating || state.shopRt;
    r.games.forEach(g => { g.packs.forEach(p => p.seller = { id: 0, name: "Azika Shop", shop: true, avg: state.shopRt.avg, count: state.shopRt.count });
      (g.offers || []).forEach(o => { o.offer = true; g.packs.push(o); }); });
    state.games = r.games; state.support = r.support || state.support; state.refPct = r.ref_percent || 5; state.paused = r.paused || ""; state.cbPct = r.cashback_pct ?? 5; state.cbLevels = r.cashback_levels || []; state.cbMin = r.cashback_min || 100; state.crypto = !!r.crypto; state.pay = r.pay || { stars: true, crypto: !!r.crypto, wallet: true }; state.starRub = r.star_rub || 1.59; state.done = r.done || 0;
    if (params.get("go") === "orders") switchTab("orders"); else showHome();
    api("/api/profile", {}).then(p => { if (p && p.ok) { state.balance = p.bonus; state.friend = { bound: !!p.friend_bound, bonus: p.friend_bonus, code: p.friend_code }; state.ids = p.ids || {}; updBal(); if ($("#qs") && state.qv == null) renderQuick(); } }).catch(() => {});
  } catch (e) {
    view(`<div class="err">Не удалось загрузить каталог.<br>${esc(e.message || "")}<br><button onclick="init()">Повторить</button></div>`);
  }
}
init();
</script>
